<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eski</title>
<meta name="description" content="post anything — audio, video, image, text, or a combination of several — and find work through the people and tags you follow.">
<link rel="icon" type="image/png" href="eski_logo.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="palette.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="palettes.css">
<link rel="stylesheet" href="pivot.css">
<script type="module" src="platform.js"></script>
<script src="pivot.js"></script>
<style>
/* feed-specific layout only — every shared control is in pivot.css, every
   shared behaviour (cards, the detail overlay, upload, sign-in) is in
   pivot.js. What's here: the feed's own scroll rhythm and empty state. */
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:var(--fs)}
*{box-sizing:border-box}
main{max-width:var(--wrap);margin:0 auto}
.feedhead{display:flex;flex-direction:column;gap:20px;width:100%;padding:20px 32px 24px 32px}
.tagpanels{display:flex;gap:56px;flex-wrap:wrap;align-items:flex-start}
.gridwrap{padding:0 32px}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:96px 32px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink);font-size:var(--fs-lg)}
.loadmore{display:flex;align-items:center;justify-content:center;width:100%;padding:48px 32px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:400;
  background:var(--ink);color:var(--paper);font-size:13px;padding:10px 18px;max-width:min(90vw,520px);
  box-shadow:0 8px 30px rgba(0,0,0,.3)}
[hidden]{display:none!important}
</style>
</head>
<body>

<header class="pivot-top site-header">
  <a class="mark wordmark" href="index.html">eski<i>!</i></a>
  <nav>
    <button class="navlink active" type="button" data-nav="home">Home</button>
    <button class="navlink" type="button" data-go="profile.html">Profile</button>
    <button class="btnline filled" type="button" data-open-upload>Upload</button>
  </nav>
</header>

<main>
  <div class="feedhead">
    <div class="feedswitch">
      <span class="feed active" data-nodelete>Discover</span>
      <div class="searchmini" data-searchmini>
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
        <input placeholder="search titles, captions, and tags" id="search-input">
      </div>
    </div>
    <div class="tagpanels">
      <div class="tagpanel" id="tags-panel">
        <div class="taghdr" data-toggle>content tags <span class="chev">&#9662;</span></div>
        <div class="tagbody" style="margin-top:10px;">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;" id="active-tags"></div>
        </div>
      </div>
      <div class="tagpanel" id="mods-panel">
        <div class="taghdr" data-toggle>modifier tags <span class="chev">&#9662;</span></div>
        <div class="tagbody" style="margin-top:12px;" id="modifier-list"></div>
      </div>
    </div>
  </div>
  <div class="gridwrap">
    <div class="fgrid" id="feed-grid"></div>
    <div class="empty" id="feed-empty" hidden>
      <b>Nothing published yet</b>
      <span>Be the first — upload something and it lands right here.</span>
    </div>
  </div>
  <div class="loadmore" id="loadmore-wrap" hidden>
    <button class="btnline" type="button" id="loadmore-btn">See more</button>
  </div>
</main>

<div id="overlay-root"></div>
<div id="toast-root"></div>

<script>
/* eski home feed. everything about a card, the detail overlay, upload and
   sign-in lives in pivot.js — this page is the feed query and its filters.

   SCOPE, HONESTLY: v1. "Discover" is the only feed — the mockup's
   rename/add/delete feed switcher implies a saved-feed model with no
   backing table yet (ROADMAP.md item 0), so this doesn't pretend to have
   it: one feed, filtered live, nothing saved across a reload. */
const P = window.Pivot;
const KINDS = P.KINDS;
const filters = { tags: [], posted: null, from: null, viewing: null,
  updated: false, liked: false, saved: false, kinds: new Set() };
let searchQuery = '';
let feedRows = [];
let feedOffset = 0;
const PAGE = 24;

async function boot(){
  await P.init(() => { loadFeed(true); });
  wireTagPanels();
  wireSearch();
  renderModifiers();
  document.getElementById('loadmore-btn').addEventListener('click', () => loadFeed(false));
  await loadFeed(true);
}
document.addEventListener('DOMContentLoaded', boot);

/* -------------------------------------------------------- tag panels */
function wireTagPanels(){
  document.querySelectorAll('[data-toggle]').forEach(h => h.addEventListener('click', () => {
    h.closest('.tagpanel').classList.toggle('collapsed');
  }));
  renderActiveTags();
}
function renderActiveTags(){
  const row = document.getElementById('active-tags');
  row.innerHTML = filters.tags.map(t => `<span class="tagchip"><span class="tagtext">#${P.esc(t)}</span>` +
    `<span class="x" data-untag="${P.esc(t)}">&times;</span></span>`).join('') +
    `<button class="tagadd" type="button" id="tagadd-btn">+</button>`;
  row.querySelectorAll('[data-untag]').forEach(x => x.addEventListener('click', () => {
    filters.tags = filters.tags.filter(t => t !== x.dataset.untag);
    renderActiveTags(); loadFeed(true);
  }));
  const addBtn = document.getElementById('tagadd-btn');
  addBtn.addEventListener('click', e => { e.stopPropagation(); openTagSearch(addBtn); });
}
async function openTagSearch(anchor){
  document.querySelectorAll('.tagsearch').forEach(t => t.remove());
  const box = document.createElement('div');
  box.className = 'tagsearch open';
  box.style.position = 'absolute';
  box.innerHTML = `<input placeholder="find a tag…"><div class="opts"></div>`;
  anchor.parentElement.style.position = 'relative';
  anchor.parentElement.appendChild(box);
  const input = box.querySelector('input'), opts = box.querySelector('.opts');
  input.focus();
  async function search(q){
    let query = P.sb.from('content_tags').select('tag').eq('target_type','work').order('tag').limit(8);
    if(q) query = query.ilike('tag', '%' + q.replace(/[%_]/g,'') + '%');
    const { data } = await query;
    const seen = new Set(filters.tags);
    const uniq = [...new Set((data || []).map(r => r.tag))].filter(t => !seen.has(t));
    opts.innerHTML = uniq.map(t => `<button type="button" class="opt" data-pick="${P.esc(t)}">#${P.esc(t)}</button>`).join('')
      || '<div class="opt" style="cursor:default;">no matching tags yet</div>';
    opts.querySelectorAll('[data-pick]').forEach(o => o.addEventListener('click', () => {
      filters.tags.push(o.dataset.pick); box.remove(); renderActiveTags(); loadFeed(true);
    }));
  }
  input.addEventListener('input', () => search(input.value.trim()));
  search('');
  setTimeout(() => document.addEventListener('click', function outside(e){
    if(!box.contains(e.target) && e.target !== anchor){ box.remove(); document.removeEventListener('click', outside); }
  }), 0);
}

/* ------------------------------------------------------ modifier tags */
function seg(group, key, opts){
  return `<div class="modgroup"><div class="modgrouplabel">${P.esc(group)}</div>
    <div class="seg" data-seg="${key}">${opts.map(o => `<span class="opt${filters[key]===o[1]?' on':''}" data-o="${P.esc(o[1]??'')}">${P.esc(o[0])}</span>`).join('')}</div></div>`;
}
function mchip(label, key){
  return `<span class="mchip${filters[key]?' on':''}" data-mtoggle="${key}">${P.esc(label)}</span>`;
}
function kindChip(k){
  const label = k === 'combination' ? 'collection' : k;
  return `<span class="mchip${filters.kinds.has(k)?' on':''}" data-ktoggle="${k}">${P.esc(label)}</span>`;
}
function renderModifiers(){
  const el = document.getElementById('modifier-list');
  el.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px;">
    ${seg('posted', 'posted', [['any time', null],['today','day'],['this week','week'],['this month','month'],['this year','year']])}
    <div style="display:flex;gap:28px;flex-wrap:wrap;">
      ${seg('from', 'from', [['anyone', null],['following','following'],['not following','not_following']])}
      ${seg('viewing', 'viewing', [['any','any'],['seen','seen'],['unseen','unseen']])}
    </div>
    <div class="modgroup"><div class="modgrouplabel">state</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">${mchip('updated','updated')}${mchip('liked','liked')}${mchip('saved','saved')}</div></div>
    <div class="modgroup"><div class="modgrouplabel">type</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">${KINDS.map(kindChip).join('')}</div></div>
  </div>`;
  el.querySelectorAll('[data-seg]').forEach(group => {
    group.querySelectorAll('[data-o]').forEach(opt => opt.addEventListener('click', () => {
      const key = group.dataset.seg, val = opt.dataset.o || null;
      filters[key] = val; renderModifiers(); loadFeed(true);
    }));
  });
  el.querySelectorAll('[data-mtoggle]').forEach(c => c.addEventListener('click', () => {
    const key = c.dataset.mtoggle;
    if((key === 'liked' || key === 'saved') && !P.user){ P.openSignIn(); return; }
    filters[key] = !filters[key]; renderModifiers(); loadFeed(true);
  }));
  el.querySelectorAll('[data-ktoggle]').forEach(c => c.addEventListener('click', () => {
    const k = c.dataset.ktoggle;
    filters.kinds.has(k) ? filters.kinds.delete(k) : filters.kinds.add(k);
    renderModifiers(); loadFeed(true);
  }));
}

/* -------------------------------------------------------------- search */
function wireSearch(){
  const box = document.getElementById('search-input').closest('.searchmini');
  box.addEventListener('click', e => { if(e.target === box) box.classList.toggle('open'); });
  const input = document.getElementById('search-input');
  input.addEventListener('focus', () => box.classList.add('open'));
  let t;
  input.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(() => { searchQuery = input.value.trim().toLowerCase(); renderGrid(); }, 180);
  });
}

/* ------------------------------------------------------------- feed */
async function loadFeed(reset){
  if(reset){ feedOffset = 0; feedRows = []; }
  document.getElementById('feed-empty').hidden = true;
  const sb = P.sb;

  let q = sb.from('works').select('*').eq('status','published').is('version_of', null)
    .order('created_at', { ascending:false }).range(feedOffset, feedOffset + PAGE - 1);
  if(filters.kinds.size) q = q.in('kind', [...filters.kinds]);
  if(filters.posted){
    const now = new Date();
    const since = { day:1, week:7, month:30, year:365 }[filters.posted];
    q = q.gte('created_at', new Date(now - since*86400000).toISOString());
  }
  if(filters.from === 'following'){
    if(!P.myFollowing.size){ renderBatch([], reset); return; }
    q = q.in('owner_id', [...P.myFollowing]);
  } else if(filters.from === 'not_following'){
    const exclude = [...P.myFollowing, ...(P.user ? [P.user.id] : [])];
    if(exclude.length) q = q.not('owner_id', 'in', `(${exclude.join(',')})`);
  }

  const { data, error } = await q;
  if(error){ P.toast(P.eski.dbError('ESK-5100','the feed could not load', error)); return; }
  let rows = data || [];

  let updatedRootIds = new Set();
  if(filters.updated && rows.length){
    const { data: vs } = await sb.from('works').select('version_of').not('version_of','is',null)
      .in('version_of', rows.map(r => r.id));
    updatedRootIds = new Set((vs || []).map(r => r.version_of));
  }
  if(filters.viewing === 'seen') rows = rows.filter(r => P.mySeenIds.has(r.id));
  else if(filters.viewing === 'unseen') rows = rows.filter(r => !P.mySeenIds.has(r.id));
  if(filters.updated) rows = rows.filter(r => updatedRootIds.has(r.id));
  if(filters.liked) rows = rows.filter(r => P.myLikes.has(r.id));
  if(filters.saved) rows = rows.filter(r => P.mySavedIds.has(r.id));

  feedOffset += PAGE;
  await annotate(rows);
  renderBatch(rows, reset);
}
async function annotate(rows){
  if(!rows.length) return;
  const ids = rows.map(r => r.id);
  const sb = P.sb;
  const [{ data: tagRows }, { data: likeRows }, { data: comboRows }] = await Promise.all([
    sb.from('content_tags').select('target_id,tag').eq('target_type','work').in('target_id', ids),
    sb.from('likes').select('target_id').eq('target_type','work').in('target_id', ids),
    sb.from('work_items').select('work_id').in('work_id', rows.filter(r => r.kind === 'combination').map(r => r.id))
  ]);
  const tagsBy = {}, likesBy = {}, countBy = {};
  (tagRows||[]).forEach(r => (tagsBy[r.target_id] ??= []).push(r.tag));
  (likeRows||[]).forEach(r => likesBy[r.target_id] = (likesBy[r.target_id]||0) + 1);
  (comboRows||[]).forEach(r => countBy[r.work_id] = (countBy[r.work_id]||0) + 1);
  rows.forEach(r => { r._tags = tagsBy[r.id] || []; r._likes = likesBy[r.id] || 0; r._itemCount = countBy[r.id] || 0; });
}
function renderBatch(rows, reset){
  feedRows = reset ? rows : feedRows.concat(rows);
  document.getElementById('loadmore-wrap').hidden = rows.length < PAGE;
  renderGrid();
}
function passesSearch(w){
  if(!searchQuery) return true;
  const hay = [w.title, w.caption, w.body, ...(w._tags||[])].filter(Boolean).join(' ').toLowerCase();
  return hay.includes(searchQuery);
}
function renderGrid(){
  const grid = document.getElementById('feed-grid');
  const filterTags = filters.tags;
  const rows = feedRows.filter(w => passesSearch(w) &&
    (!filterTags.length || filterTags.every(t => (w._tags||[]).includes(t))));
  grid.innerHTML = rows.map(P.cardHtml).join('');
  document.getElementById('feed-empty').hidden = feedRows.length > 0;
}
</script>
</body>
</html>
