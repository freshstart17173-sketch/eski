<!doctype html>
<html lang="en" data-theme="light-green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eski — shorts</title>
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="broadsheet.css">
<link rel="stylesheet" href="../../../palettes.css">
<style>
/* ============================================================
   eski — shorts, in the eski-arena style (.claude/skills/eski-arena).

   one column, one comic per row, full width, no crop — the whole
   reason for this style over the shorts grid this replaced is that
   a grid forces every card to negotiate a column width with its
   neighbours, and a comic with an unusual aspect ratio loses that
   negotiation. a single column never asks it to.

   there is no algorithmic feed here, and there is also no INFINITE
   one: every tab is a #tag query and every tab has a stated cap.
   reaching it does not reload the same feed — it hands you the tab
   strip again, as an invitation into a different one. an eski feed
   is not supposed to be a thing you could theoretically never leave.

   a tag is a tag whether it describes the comic (#gag, #oneshot) or
   describes YOUR relationship to it (#following, #lastweek) — there
   is one AND-query under both, not a content system with a second,
   different filter system bolted on for "following". see tagsOf().

   opening a block does not navigate anywhere: the reader is the same
   feed, re-rendered full-screen starting at the block you tapped, so
   "next" is just the rest of the queue you were already scrolling —
   comments included inline, capped the same honest way the feed is.
   ============================================================ */

.wrap{max-width:var(--arena-max);margin:0 auto;padding:0 var(--s4) var(--s7)}
:root{ --arena-max:640px; --arena-gap:var(--s6); }

/* ---------- the tab strip is NOT a new control ----------
   .tabs / .tab already exist in broadsheet.css ("used by the profile") —
   one scrollable row, --mark underline on the selected one, --ui on the
   rest. Restating its colour or hover here would be exactly the
   .btn.p:hover trap CLAUDE.md warns about, so this only adds what
   broadsheet doesn't already cover: the tag composer at the end of
   the row, which is new to this surface. */
.wrap > .tabs{margin-bottom:var(--s5)}
.tabcompose{display:flex;flex:none;align-items:center;height:100%;padding:0 var(--s3)}
.tabcompose input{border:0;background:none;font:inherit;font-size:var(--fs-micro);
  color:var(--ui);width:160px;padding:0}
.tabcompose input::placeholder{color:var(--label);opacity:.6}
.tabcompose input:focus{outline:0}

/* ---------- the block: art, glyphs, one caption line, a byline, a rule ---------- */
.feed{display:flex;flex-direction:column}
.block{display:block;padding:var(--arena-gap) 0 0;text-align:left;background:none;
  border:0;color:inherit;font:inherit;width:100%}
.bplate{position:relative;overflow:hidden;border:1px solid var(--rule-hair);
  background:var(--paper-1);width:100%}
[data-theme="dark"] .bplate{background:var(--surf-2)}
.bplate img{display:block;width:100%;height:auto}
.baudio{display:flex;gap:6px;height:15px;margin-top:var(--s3)}
.baudio svg{width:13px;height:13px;fill:none;stroke:var(--label);stroke-width:1.4}
.bcap{margin-top:4px;font-size:var(--fs-sm);color:var(--ink);line-height:1.4}
.bby{display:flex;gap:var(--s2);align-items:baseline;margin-top:2px;
  font-size:var(--fs-micro);letter-spacing:.04em}
.bby .who{color:var(--ui)}
.bby .kind{color:var(--label)}
.brule{margin-top:var(--arena-gap);border-top:1px solid var(--rule-hair)}

/* a long-form block is the same shape, just at 2:3 and named as what it is,
   so it never reads as a broken short when it turns up in #following. */
.block.long .bplate{aspect-ratio:2/3;max-width:280px}

/* ---------- the cap: a fact, not a spinner ---------- */
.cap{padding:var(--s6) 0 var(--s5);text-align:center}
.cap p{margin:0 0 var(--s4);font-size:var(--fs-xs);color:var(--soft-ink)}
.cap p b{color:var(--ink);font-weight:500}
.cap .keepgoing{font-size:var(--fs-micro);letter-spacing:.1em;text-transform:uppercase;
  color:var(--label);margin-bottom:var(--s2)}

/* ---------- the reader: the same feed, full screen, no navigation ----------
   an overlay toggled with `hidden`, not a page — so there is nothing to
   reload and nothing that needs a route. a real build would still want
   history.pushState so the back button and a shared link both work; a
   static design doc doesn't need to prove that part. */
.reader{position:fixed;inset:0;background:var(--paper);overflow-y:auto;z-index:50}
.reader-bar{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--rule);
  padding:var(--s3) var(--s4);display:flex;justify-content:flex-end;z-index:1}
</style>
</head>
<body>

<header class="top">
  <a class="mark" href="home.html">eski<i>!</i></a>
  <nav>
    <a href="home.html">home</a>
    <a href="home.html#browse">browse</a>
    <button aria-current="page">shorts</button>
    <a href="home.html#studio">studio</a>
    <a href="home.html#profile">profile</a>
  </nav>
</header>

<main><div class="wrap">

  <div class="tabs" id="tabbar"></div>
  <div class="feed" id="feed"></div>
  <div class="cap" id="cap" hidden></div>

</div></main>

<div class="reader" id="reader" hidden>
  <div class="reader-bar"><button class="btn sm" id="reader-close">close</button></div>
  <div class="wrap" id="reader-list"></div>
  <div class="cap" id="reader-cap" hidden></div>
</div>

<script>
/* ============================================================
   mock data. cover art is borrowed from the long-form set — this
   is a design doc with no upload pipeline behind it.
   ============================================================ */
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&lt;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const TODAY = new Date('2026-08-14');
const daysAgo = n => { const d = new Date(TODAY); d.setDate(d.getDate() - n); return d.toISOString().slice(0,10); };

const MIC = '<svg viewBox="0 0 14 14"><rect x="5" y="1.2" width="4" height="7" rx="2"/>' +
  '<path d="M3 7.2a4 4 0 0 0 8 0M7 11.2v1.6M4.8 12.8h4.4"/></svg>';
const NOTE = '<svg viewBox="0 0 14 14"><circle cx="4" cy="10.5" r="2"/>' +
  '<path d="M6 10.5V2.2l6-1.4v7.2"/><circle cx="10" cy="8" r="2"/></svg>';

/* kind: short | long. following: true if you follow this creator. tags
   are content tags, genre-shaped — a separate thing from kind/following/
   lastweek only because those three are computed, not authored; to a
   tab query they're the same kind of tag. ratio only matters for shorts. */
const ITEMS = [
  {id:'i1', kind:'short', creator:'abusegoblin', cap:'he does this every single day', ratio:'1/1',
   img:'../covers/jigoku.jpg', added:daysAgo(0), voice:true, score:false, following:true, tags:['gag']},
  {id:'i2', kind:'short', creator:'beetlemoses', cap:'panel three is the whole joke', ratio:'4/5',
   img:'../covers/talking-axe.jpg', added:daysAgo(0), voice:false, score:true, following:true, tags:['gag']},
  {id:'i3', kind:'long', title:'falling in love on the path to hell', creator:'duggan & brown',
   img:'../covers/jigoku.jpg', added:daysAgo(1), voice:true, score:true, following:true, tags:['horror','romance']},
  {id:'i4', kind:'short', creator:'goobsmooch', cap:'a normal tuesday for these two', ratio:'1/1',
   img:'../covers/sunbound.jpg', added:daysAgo(1), voice:true, score:true, following:false, tags:['sliceoflife']},
  {id:'i5', kind:'short', creator:'mbekidraws', cap:'no caption, the art can carry it', ratio:'4/5',
   img:'../covers/concrete-sky.jpg', added:daysAgo(2), voice:false, score:false, following:false, tags:['oneshot']},
  {id:'i6', kind:'short', creator:'abusegoblin', cap:'part two of yesterday, sorry', ratio:'1/1',
   img:'../covers/second-dark.jpg', added:daysAgo(2), voice:true, score:false, following:true, tags:['gag']},
  {id:'i7', kind:'long', title:'the dark knight returns', creator:'miller, janson & varley',
   img:'../covers/second-dark.jpg', added:daysAgo(3), voice:true, score:true, following:true, tags:['crime','noir']},
  {id:'i8', kind:'short', creator:'vargacomics', cap:'drew this on the train', ratio:'4/5',
   img:'../covers/jigoku.jpg', added:daysAgo(3), voice:false, score:false, following:false, tags:['sliceoflife']},
  {id:'i9', kind:'short', creator:'beetlemoses', cap:'the axe has opinions about this', ratio:'1/1',
   img:'../covers/talking-axe.jpg', added:daysAgo(4), voice:true, score:true, following:true, tags:['gag']},
  {id:'i10', kind:'short', creator:'wrenlines', cap:'four panels, one bad decision', ratio:'4/5',
   img:'../covers/sunbound.jpg', added:daysAgo(5), voice:false, score:true, following:false, tags:['oneshot']},
  {id:'i11', kind:'long', title:'blame! master edition', creator:'tsutomu nihei',
   img:'../covers/concrete-sky.jpg', added:daysAgo(6), voice:true, score:true, following:false, tags:['scifi']},
  {id:'i12', kind:'short', creator:'goobsmooch', cap:'the follow-up nobody asked for', ratio:'1/1',
   img:'../covers/concrete-sky.jpg', added:daysAgo(6), voice:true, score:false, following:false, tags:['sliceoflife']},
  {id:'i13', kind:'short', creator:'opokudraws', cap:'this took four attempts to letter', ratio:'4/5',
   img:'../covers/second-dark.jpg', added:daysAgo(8), voice:false, score:false, following:false, tags:['oneshot']},
  {id:'i14', kind:'short', creator:'mbekidraws', cap:'a villain who is just tired', ratio:'1/1',
   img:'../covers/jigoku.jpg', added:daysAgo(9), voice:true, score:true, following:false, tags:['gag']},
  {id:'i15', kind:'long', title:'all-star superman', creator:'morrison, quitely & grant',
   img:'../covers/sunbound.jpg', added:daysAgo(10), voice:false, score:true, following:true, tags:['scifi']},
  {id:'i16', kind:'short', creator:'vargacomics', cap:'the last panel is the whole point', ratio:'4/5',
   img:'../covers/talking-axe.jpg', added:daysAgo(11), voice:false, score:true, following:false, tags:['gag']},
  {id:'i17', kind:'short', creator:'abusegoblin', cap:'a week of these, back to back', ratio:'1/1',
   img:'../covers/sunbound.jpg', added:daysAgo(12), voice:true, score:false, following:true, tags:['gag']},
  {id:'i18', kind:'short', creator:'beetlemoses', cap:'redraw of the very first post', ratio:'4/5',
   img:'../covers/jigoku.jpg', added:daysAgo(14), voice:false, score:false, following:true, tags:['gag']},
  {id:'i19', kind:'long', title:'noise', creator:'tsutomu nihei',
   img:'../covers/concrete-sky.jpg', added:daysAgo(15), voice:true, score:true, following:false, tags:['scifi','horror']},
  {id:'i20', kind:'short', creator:'opokudraws', cap:'a two-parter, part one', ratio:'1/1',
   img:'../covers/talking-axe.jpg', added:daysAgo(16), voice:false, score:false, following:false, tags:['sliceoflife']}
];

/* ---------- tabs: a name, a set of #tags to AND together, a cap ---------- */
/* CAP is provisional — the real number is a product decision that wants
   real usage data, not a guess made in a design doc. eight is picked here
   purely so this mockup can demonstrate what hitting a cap looks like
   without needing eighty fake rows to prove it. */
const CAP = 8;
const BUILTIN_TABS = [
  {tags:['following']},
  {tags:['shortform']},
  {tags:['longform']},
  {tags:['lastweek']}
];
const customTabs = [];

/* every tag lives in one list — a genre an author picked (#gag), a shape
   the item just has (#shortform), and a fact about you (#following,
   #lastweek) are computed or authored differently but AND together
   exactly the same way once they're in this array. */
function tagsOf(item){
  const t = [item.kind === 'short' ? 'shortform' : 'longform', ...(item.tags || [])];
  if(item.following) t.push('following');
  if(item.added >= daysAgo(7)) t.push('lastweek');
  return t;
}
function tabLabel(tags){ return tags.map(t => '#' + t).join(' '); }
function resolve(tags){
  return ITEMS.filter(i => tags.every(t => tagsOf(i).includes(t)))
    .sort((a,b) => b.added.localeCompare(a.added));
}

let active = BUILTIN_TABS[0].tags;

function audioGlyphs(i){
  return (i.voice ? `<span title="voice">${MIC}</span>` : '')
       + (i.score ? `<span title="score">${NOTE}</span>` : '');
}

function blockEl(i){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'block' + (i.kind === 'long' ? ' long' : '');
  const ratio = i.kind === 'long' ? '2/3' : i.ratio;
  b.innerHTML = `<div class="bplate" style="aspect-ratio:${ratio}">
      <img src="${esc(i.img)}" alt="" loading="lazy"></div>
    <div class="baudio">${audioGlyphs(i)}</div>
    <div class="bcap">${esc(i.kind === 'long' ? i.title : (i.cap || ''))}</div>
    <div class="bby"><span class="who">@${esc(i.creator)}</span>
      ${i.kind === 'long' ? '<span class="kind">· eski</span>' : ''}</div>
    <div class="brule"></div>`;
  b.addEventListener('click', () => openReader(i.id));
  return b;
}

/* ============================================================
   comments, faked. this is a static design doc with no Supabase
   behind it, so this is NOT comments.js (which needs window.eski.sb()
   and a real table) — it's the same markup comments.js's row() and
   composer() already produce, by the same classes, in broadsheet.css,
   fed from a deterministic mock list instead of a query. a real build
   mounts the genuine eskiComments.mount() here and deletes this. */
const COMMENT_POOL = [
  {who:'r. mbeki', body:'the timing on the last panel is perfect'},
  {who:'j. wren', body:'voiced the lead if anyone wants to hear it — up on #following now'},
  {who:'samuel opoku', body:'this is the funniest one this month'},
  {who:'a. varga', body:'scored this last night'}
];
function fakeComments(item){
  let seed = 0; for(const c of item.id) seed = (seed * 31 + c.charCodeAt(0)) & 255;
  return COMMENT_POOL.slice(0, seed % 4).map((c, i) => ({...c, when: `${(i + 1) * 2}h ago`}));
}
function commentsHtml(item){
  const rows = fakeComments(item);
  return `<div class="cm-write"><textarea class="cm-box" disabled
      placeholder="Say something about this eski — static mockup, not wired up"></textarea>
      <div class="cm-acts"><button class="btn sm p" disabled>Post</button></div></div>`
    + (rows.length ? rows.map(c => `<div class="cm">
        <div class="cm-head"><span class="cm-who">${esc(c.who)}</span>
          <span class="sp"></span><span class="cm-when">${esc(c.when)}</span></div>
        <p class="cm-body">${esc(c.body)}</p>
      </div>`).join('') : '<p class="note-line">Nothing here yet. Be the first.</p>');
}

/* ============================================================
   the reader. a block tapped in the feed re-renders the same queue
   full-screen starting there — no route, no reload, comments folded
   into each item, the same cap the feed itself has.
   ============================================================ */
function readerItemEl(i){
  const el = document.createElement('div');
  el.className = 'block' + (i.kind === 'long' ? ' long' : '');
  const ratio = i.kind === 'long' ? '2/3' : i.ratio;
  const n = fakeComments(i).length;
  el.innerHTML = `<div class="bplate" style="aspect-ratio:${ratio}">
      <img src="${esc(i.img)}" alt="" loading="lazy"></div>
    <div class="baudio">${audioGlyphs(i)}</div>
    <div class="bcap">${esc(i.kind === 'long' ? i.title : (i.cap || ''))}</div>
    <div class="bby"><span class="who">@${esc(i.creator)}</span>
      ${i.kind === 'long' ? '<span class="kind">· eski</span>' : ''}</div>
    <button class="fold" aria-expanded="false" style="margin-top:var(--s3)">
      <span class="caret"></span><span>comments</span><span class="sp"></span>
      <span class="n">${n}</span></button>
    <div class="folded">${commentsHtml(i)}</div>
    <div class="brule"></div>`;
  el.querySelector('.fold').addEventListener('click', e => {
    const f = e.currentTarget;
    f.setAttribute('aria-expanded', f.getAttribute('aria-expanded') !== 'true');
  });
  return el;
}

function openReader(fromId){
  const items = resolve(active).slice(0, CAP);
  const idx = Math.max(0, items.findIndex(i => i.id === fromId));
  const queue = items.slice(idx);
  document.getElementById('reader-list').replaceChildren(...queue.map(readerItemEl));
  const total = resolve(active).length, capEl = document.getElementById('reader-cap');
  capEl.hidden = total <= CAP;
  if(!capEl.hidden) capEl.innerHTML =
    `<p>that's <b>${items.length} of ${total}</b> in <b>${esc(tabLabel(active))}</b> — everything for now.</p>`;
  const reader = document.getElementById('reader');
  reader.hidden = false;
  reader.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function closeReader(){
  document.getElementById('reader').hidden = true;
  document.body.style.overflow = '';
}
document.getElementById('reader-close').addEventListener('click', closeReader);
addEventListener('keydown', e => {
  if(e.key === 'Escape' && !document.getElementById('reader').hidden) closeReader();
});

function renderTabs(){
  const bar = document.getElementById('tabbar');
  const all = [...BUILTIN_TABS, ...customTabs];
  bar.innerHTML = '';
  all.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab'; btn.type = 'button';
    btn.setAttribute('aria-selected', String(t.tags.join() === active.join()));
    btn.textContent = tabLabel(t.tags);
    btn.addEventListener('click', () => switchTab(t.tags));
    bar.appendChild(btn);
  });
  const compose = document.createElement('div');
  compose.className = 'tabcompose';
  compose.innerHTML = `<input type="text" placeholder="+ #following #gag #lastweek">`;
  compose.querySelector('input').addEventListener('keydown', e => {
    if(e.key !== 'Enter') return;
    const tags = e.target.value.split(/\s+/).map(t => t.replace(/^#/,'').toLowerCase()).filter(Boolean);
    if(!tags.length || !resolve(tags).length){ e.target.value = ''; return; }
    if(!customTabs.some(t => t.tags.join() === tags.join())) customTabs.push({tags});
    e.target.value = '';
    switchTab(tags);
  });
  bar.appendChild(compose);
}

function renderFeed(){
  const items = resolve(active).slice(0, CAP);
  const feed = document.getElementById('feed');
  feed.replaceChildren(...items.map(blockEl));
  const total = resolve(active).length;
  const capEl = document.getElementById('cap');
  if(total <= CAP){ capEl.hidden = true; return; }
  capEl.hidden = false;
  capEl.innerHTML = `<p>you're through <b>${items.length} of ${total}</b> in <b>${esc(tabLabel(active))}</b>
    — that's everything for now.</p>
    <div class="keepgoing">keep going in</div>
    <div class="tabs" id="cap-tabs"></div>`;
  const capBar = capEl.querySelector('#cap-tabs');
  [...BUILTIN_TABS, ...customTabs].forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab'; btn.type = 'button';
    btn.setAttribute('aria-selected', String(t.tags.join() === active.join()));
    btn.textContent = tabLabel(t.tags);
    btn.addEventListener('click', () => switchTab(t.tags));
    capBar.appendChild(btn);
  });
}

function switchTab(tags){
  active = tags;
  renderTabs();
  renderFeed();
  window.scrollTo({top:0, behavior:'smooth'});
}

renderTabs();
renderFeed();
</script>
</body>
</html>
