<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eski — composer studio</title>
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="broadsheet.css">
<style>
/* ============================================================
   eski — the composer studio. where sound is laid under a comic.
   chrome comes from broadsheet.css.

   the whole surface is one idea: audio STACKS. a layer is a lane, a
   lane runs the length of the comic, and lanes play at the same time.
   rain can run pages 1 to 47 on one lane while a different piece of
   music owns pages 12 to 19 on the lane above it and a door slams on
   page 14 on the lane above that.

   so the primary view is a page ruler with lanes under it, because
   the composer's real question is never "what is this file" — it is
   "what is playing on page 14, and where does it stop".

   clips are dragged in from the bay, moved and resized by their page
   range, and inspected one at a time at the foot.
   ============================================================ */
:root{
  --bay-w:250px;
  --pv-w:190px;
  --lane-h:30px;
  --col:52px;          /* one page column at rest */
  --insp:112px;
}
html,body{height:100%}
body{overflow:hidden}
.top{height:var(--hdr)}

.frame{display:grid;grid-template-columns:var(--bay-w) 1fr var(--pv-w);
  height:calc(100vh - var(--hdr))}
@media(max-width:1100px){
  body{overflow:auto}
  .frame{grid-template-columns:1fr;height:auto}
}

/* ---------- the bay ---------- */
.bay{border-right:1px solid var(--rule);border-top:0;min-height:0}
.bay .baylist{flex:1}
.cliprow[aria-grabbed="true"]{box-shadow:inset 3px 0 0 var(--mark)}
.kindtag{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--label);
  border:1px solid var(--rule-hair);padding:0 4px;line-height:14px}

/* ---------- the board: lane names fixed, pages scrolling beside them ----------
   the names cannot ride inside the scroller: a sticky cell is trapped in its
   own grid column and slides away with it. so the board is two panes, and
   the vertical scroll of the right one is mirrored onto the left. */
.sheetcol{display:grid;grid-template-rows:1fr auto var(--insp);min-height:0;min-width:0}
.board{display:grid;grid-template-columns:200px 1fr;min-height:0;min-width:0}
.heads{overflow:hidden;border-right:1px solid var(--rule)}
.hscroll{overflow:auto;min-width:0}
.rulerspacer{height:23px;border-bottom:1px solid var(--rule)}

.ruler{display:grid;background:var(--paper);border-bottom:1px solid var(--rule)}
.rulercell{border-left:1px solid var(--rule-hair);padding:var(--s1) 0 3px;text-align:center;
  font-size:10px;color:var(--label);font-variant-numeric:tabular-nums;
  background:none;transition:background var(--t-fast) var(--ease)}
.rulercell:hover{background:var(--surface);color:var(--ink)}
.rulercell[aria-current="true"]{background:var(--mark);color:var(--paper)}
[data-theme="dark"] .rulercell[aria-current="true"]{color:var(--sage-900)}
.rulercell.tenth{border-left-color:var(--rule)}
.lane{display:grid;border-bottom:1px solid var(--rule-hair);height:var(--lane-h)}
.lane.first,.lanehead.first{border-top:1px solid var(--rule)}
.lanehead{height:var(--lane-h);border-bottom:1px solid var(--rule-hair);
  padding:0 var(--s3);display:flex;align-items:center;gap:var(--s2);min-width:0;
  background:var(--paper)}
.lanehead .nm{font-size:var(--fs-xs);min-width:0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.lanehead .kind{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--label)}
.lanehead .sp{flex:1}
.lanehead .mute{width:18px;height:18px;border:1px solid var(--rule-hair);background:none;
  color:var(--label);font-size:9px;line-height:1;transition:all var(--t-fast) var(--ease)}
.lanehead .mute:hover{border-color:var(--ink);color:var(--ink)}
.lanehead .mute[aria-pressed="true"]{background:var(--rule);color:var(--paper);
  border-color:var(--rule)}
[data-theme="dark"] .lanehead .mute[aria-pressed="true"]{color:var(--sage-900)}

/* the empty page cells behind the clips: one hairline per page, so an empty
   lane still reads as a ruler you can drop onto */
.cell{border-left:1px solid var(--rule-hair);min-height:var(--lane-h)}
.cell.tenth{border-left-color:var(--rule)}
.lane.dropping{background:var(--surface)}
.lane.dropping .cell{border-left-color:var(--line-strong)}

/* a clip owns a page range. the range IS the object; there is no timeline
   under it to disagree with. */
.clip{position:relative;margin:2px 1px;height:calc(var(--lane-h) - 4px);
  border:1px solid var(--rule);background:var(--surface);color:var(--ink);
  display:flex;align-items:center;gap:6px;padding:0 var(--s2);min-width:0;
  font-size:var(--fs-xs);cursor:grab;user-select:none;
  transition:background var(--t-fast) var(--ease)}
.clip:hover{background:var(--paper-1)}
[data-theme="dark"] .clip:hover{background:var(--surf-2)}
.clip .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip .rng{font-size:9px;color:var(--label);font-variant-numeric:tabular-nums;
  margin-left:auto;white-space:nowrap}
.clip[aria-selected="true"]{background:var(--mark);border-color:var(--mark);color:var(--paper)}
[data-theme="dark"] .clip[aria-selected="true"]{color:var(--sage-900)}
.clip[aria-selected="true"] .rng{color:inherit;opacity:.7}
.clip.bed{border-style:dashed}          /* a bed is a wash, not an event */
.clip.oneshot{justify-content:center;padding:0 2px}
.clip.oneshot .nm{font-size:9px;letter-spacing:.04em}
.clip.voice{background:none;border-style:dotted;color:var(--muted);cursor:default}
.grip{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:2}
.grip.l{left:-1px}.grip.r{right:-1px}
.grip::after{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:1px;
  background:currentColor;opacity:0;transition:opacity var(--t-fast) var(--ease)}
.clip:hover .grip::after{opacity:.5}
.clip.oneshot .grip{display:none}

.addlane{display:flex;gap:var(--s2);align-items:center;padding:var(--s2) var(--s3);
  border-top:1px solid var(--rule)}

/* ---------- the page preview ---------- */
.pv{border-left:1px solid var(--rule);display:grid;grid-template-rows:auto 1fr auto;
  min-height:0}
.pvhead{padding:var(--s2) var(--s3);border-bottom:1px solid var(--rule);
  font-size:var(--fs-micro);letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
.pvhead b{color:var(--ink);font-weight:500}
.pvart{padding:var(--s3);display:grid;place-items:start center;min-height:0;overflow:hidden}
.pvart .plate{max-width:100%;max-height:100%}
.pvart img{max-width:100%;max-height:100%;object-fit:contain}
/* what is audible on the page you are looking at, stacked in playing order */
.pvstack{border-top:1px solid var(--rule);max-height:42%;overflow:auto}
.pvrow{display:grid;grid-template-columns:1fr auto;gap:var(--s2);align-items:baseline;
  padding:4px var(--s3);border-bottom:1px solid var(--rule-hair);font-size:var(--fs-xs)}
.pvrow span:last-child{font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--label)}
.pvrow.quiet{color:var(--muted);font-style:italic}

/* ---------- the inspector ---------- */
.insp{border-top:1px solid var(--rule);padding:var(--s2) var(--s3);overflow:auto;
  display:grid;grid-template-columns:1fr auto;gap:var(--s3);align-items:start}
.insp .none{color:var(--label);font-size:var(--fs-xs);letter-spacing:.04em}
.inspgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
  gap:var(--s1) var(--s4);min-width:0}
.f{display:grid;gap:2px;min-width:0}
.f .k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--label)}
.f .v{font-size:var(--fs-xs);font-variant-numeric:tabular-nums}
.f input[type=range]{width:100%;accent-color:var(--mark)}
.f input[type=number],.f input[type=text],.f select{width:100%;height:22px;
  border:1px solid var(--rule-hair);background:var(--surface);color:var(--ink);
  font:inherit;font-size:var(--fs-xs);padding:0 4px}
.inspacts{display:flex;gap:var(--s2);align-items:center}
.insptitle{font-family:var(--font-display);font-size:15px;line-height:20px}
</style>
</head>
<body>

<header class="top">
  <a class="mark" href="home.html">eski<i>!</i></a>
  <div class="what">
    <span class="ttl" id="w-title">the second dark</span>
    <span id="w-sub">47 pages · scoring</span>
  </div>
  <span class="sp"></span>
  <button class="btn quiet" id="fit">fit pages</button>
  <div class="hotkeys">
    <button class="btn quiet" aria-label="keyboard shortcuts">hotkeys</button>
    <div class="pop">
      <div><kbd>← →</kbd><span>move the selected clip</span></div>
      <div><kbd>, .</kbd><span>shorten / lengthen it</span></div>
      <div><kbd>l</kbd><span>loop it</span></div>
      <div><kbd>⌫</kbd><span>remove it</span></div>
    </div>
  </div>
  <button class="btn p" id="publish">publish score</button>
</header>

<div class="frame">

  <div class="bay">
    <div class="bayhead"><span>sound bay</span><span class="sp"></span>
      <span class="n" id="bay-n"></span>
      <button class="btn sm" id="bay-add">add files</button></div>
    <div class="baylist" id="baylist"></div>
  </div>

  <div class="sheetcol">
    <div class="board">
      <div class="heads"><div class="rulerspacer"></div><div id="heads"></div></div>
      <div class="hscroll" id="hscroll"><div id="sheet"></div></div>
    </div>
      <div class="addlane">
        <span class="head" style="border:0;padding:0;font-size:var(--fs-micro);
          letter-spacing:.14em;text-transform:uppercase;color:var(--label)">add a layer</span>
        <button class="btn sm" data-add="bed">bed</button>
        <button class="btn sm" data-add="score">score</button>
        <button class="btn sm" data-add="oneshot">effects</button>
      </div>
    <div class="insp" id="insp"></div>
  </div>

  <div class="pv">
    <div class="pvhead">page <b id="pv-n">1</b></div>
    <div class="pvart" id="pv-art"></div>
    <div class="pvstack" id="pv-stack"></div>
  </div>
</div>

<input type="file" id="filein" accept="audio/*" multiple hidden>
<div class="droplayer" id="droplayer"><div>
  <b>drop sound here</b>
  <span>it lands in the bay · drag it onto a layer to give it pages</span>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   the score. layers stack; clips inside a layer own page ranges.

   this is the shape the manifest carries (see SPEC.md, audio model):
     layer  = {id, name, kind, volume, duck, muted, clips[]}
     clip   = {id, name, from, to, gain, loop, dur}
   a clip on an oneshot layer has from === to: it belongs to one page
   and is fired there rather than owning anything.
   ============================================================ */
const PAGES = 47;
const ART = '../covers/second-dark.jpg';

const LAYERS = [
  {id:'L1', name:'rain', kind:'bed', volume:45, duck:'off', muted:false, clips:[
    {id:'c1', name:'rain, continuous', from:1, to:47, gain:-6, loop:true, dur:'4:12'}
  ]},
  {id:'L2', name:'score', kind:'score', volume:100, duck:'medium', muted:false, clips:[
    {id:'c2', name:'one night without light', from:1, to:11, gain:0, loop:true, dur:'6:40'},
    {id:'c3', name:'the counting', from:12, to:19, gain:-2, loop:true, dur:'3:58'},
    {id:'c4', name:'forty-two', from:20, to:33, gain:0, loop:false, dur:'5:02'},
    {id:'c5', name:'one night, reprise', from:38, to:47, gain:-3, loop:true, dur:'4:44'}
  ]},
  {id:'L3', name:'room tone', kind:'bed', volume:30, duck:'off', muted:false, clips:[
    {id:'c6', name:'hall, empty', from:12, to:26, gain:-10, loop:true, dur:'2:00'}
  ]},
  {id:'L4', name:'effects', kind:'oneshot', volume:100, duck:'light', muted:false, clips:[
    {id:'c7', name:'door', from:14, to:14, gain:0, loop:false, dur:'0:02'},
    {id:'c8', name:'match', from:21, to:21, gain:-4, loop:false, dur:'0:01'},
    {id:'c9', name:'crowd', from:21, to:21, gain:-8, loop:false, dur:'0:06'},
    {id:'c10', name:'wind up', from:34, to:34, gain:0, loop:false, dur:'0:04'}
  ]},
  /* what the voice actors have already turned in. the composer cannot move
     it, but must be able to see where the talking is. */
  {id:'L5', name:'voices', kind:'voice', volume:100, duck:'—', muted:false, locked:true, clips:[
    {id:'v1', name:'gwen · 8 lines', from:3, to:9, gain:0, loop:false, dur:'—'},
    {id:'v2', name:'narration · 14 lines', from:12, to:26, gain:0, loop:false, dur:'—'},
    {id:'v3', name:'the mother · 5 lines', from:30, to:36, gain:0, loop:false, dur:'—'}
  ]}
];

const BAY = [
  {id:'b1', name:'thunder-distant.wav', dur:'0:08', kind:'oneshot', used:false},
  {id:'b2', name:'strings-cold.mp3', dur:'5:20', kind:'score', used:false},
  {id:'b3', name:'wind-loop.opus', dur:'1:30', kind:'bed', used:false}
];

let page = 1;
let selected = null;        // clip id
let bayPick = null;
let col = 52;               // page column width, live

const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const allClips = () => LAYERS.flatMap(l => l.clips.map(c => ({c, l})));
const findClip = id => allClips().find(x => x.c.id === id);
const KIND_WORD = {bed:'bed', score:'score', oneshot:'effects', voice:'voices'};

/* which page is under this x, in this lane */
function pageAt(lane, clientX){
  const r = lane.getBoundingClientRect();
  return Math.min(PAGES, Math.max(1, Math.floor((clientX - r.left) / col) + 1));
}

const PLAY = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3.5 2 10 6l-6.5 4z"/></svg>';
const PAUSE = '<svg viewBox="0 0 12 12" aria-hidden="true">'
  + '<rect x="3" y="2.5" width="2.4" height="7"/><rect x="6.6" y="2.5" width="2.4" height="7"/></svg>';

/* ============================================================
   the sheet. one row of page columns per lane; a lane splits into
   as many rows as it needs so two clips that overlap are both visible
   — which is the whole point of a stack.
   ============================================================ */
function packRows(clips){
  const rows = [];
  [...clips].sort((a, b) => a.from - b.from || a.to - b.to).forEach(c => {
    let r = rows.find(row => row.every(x => c.from > x.to || c.to < x.from));
    if(!r){ r = []; rows.push(r); }
    r.push(c);
  });
  return rows.length ? rows : [[]];
}

function cols(){ return `repeat(${PAGES}, ${col}px)`; }

function render(){
  const packed = LAYERS.map(l => ({l, rows:packRows(l.clips)}));

  document.getElementById('heads').innerHTML = packed.map(({l, rows}) =>
    rows.map((row, ri) => ri === 0 ? laneHead(l, rows.length)
      : `<div class="lanehead"></div>`).join('')).join('');

  document.getElementById('sheet').innerHTML =
    `<div class="ruler" style="grid-template-columns:${cols()}">
       ${Array.from({length:PAGES}, (_, i) => `
         <button class="rulercell${(i + 1) % 10 === 1 && i ? ' tenth' : ''}"
           data-page="${i + 1}" aria-current="${page === i + 1}">${i + 1}</button>`).join('')}
     </div>`
    + packed.map(({l, rows}) => rows.map((row, ri) => `
        <div class="lane${ri === 0 ? ' first' : ''}" style="grid-template-columns:${cols()}"
             data-layer="${l.id}">
          ${Array.from({length:PAGES}, (_, i) => `
            <div class="cell${(i + 1) % 10 === 1 && i ? ' tenth' : ''}"
              data-cell="${l.id}:${i + 1}"></div>`).join('')}
          ${row.map(c => clipHtml(c, l)).join('')}
        </div>`).join('')).join('');

  /* the spacer above the names is measured, not guessed: a 2px difference
     puts every name half a row out from its lane. */
  const ruler = document.querySelector('.ruler');
  if(ruler) document.querySelector('.rulerspacer').style.height = ruler.offsetHeight + 'px';

  paintPreview();
  paintInspector();
}
/* the names pane has no scrollbar of its own; it follows the field */
document.getElementById('hscroll').addEventListener('scroll', e => {
  document.getElementById('heads').parentElement.scrollTop = e.currentTarget.scrollTop;
});

function laneHead(l, rows){
  return `<div class="lanehead first">
    <span class="nm">${esc(l.name)}</span>
    <span class="kind">${esc(KIND_WORD[l.kind])}</span>
    <span class="sp"></span>
    ${rows > 1 ? `<span class="kind">${rows} deep</span>` : ''}
    ${l.locked ? `<span class="kind">read only</span>`
      : `<button class="mute" data-mute="${l.id}" aria-pressed="${l.muted}"
           title="mute this layer">m</button>`}
  </div>`;
}

function clipHtml(c, l){
  const span = c.to - c.from + 1;
  return `<div class="clip ${l.kind}" data-clip="${c.id}" aria-selected="${selected === c.id}"
    style="grid-column:${c.from} / span ${span};grid-row:1"
    title="${esc(c.name)} · pages ${c.from}–${c.to}">
    ${l.locked ? '' : '<span class="grip l" data-grip="l"></span>'}
    <span class="nm">${esc(c.name)}</span>
    ${l.kind === 'oneshot' ? '' :
      `<span class="rng">${c.from}–${c.to}${c.loop ? ' ∞' : ''}</span>`}
    ${l.locked ? '' : '<span class="grip r" data-grip="r"></span>'}
  </div>`;
}

/* ---------- what is audible on the page you are looking at ---------- */
function paintPreview(){
  document.getElementById('pv-n').textContent = page;
  document.getElementById('pv-art').innerHTML =
    `<div class="plate"><img src="${ART}" alt="page ${page}"></div>`;
  const here = LAYERS.flatMap(l => l.clips
    .filter(c => page >= c.from && page <= c.to)
    .map(c => ({c, l})));
  document.getElementById('pv-stack').innerHTML = here.length
    ? here.map(({c, l}) => `<div class="pvrow${l.muted ? ' quiet' : ''}">
        <span>${esc(c.name)}</span><span>${esc(KIND_WORD[l.kind])}</span></div>`).join('')
    : `<div class="pvrow quiet"><span>silent page</span><span>nothing</span></div>`;
}

/* ---------- the inspector ---------- */
function paintInspector(){
  const box = document.getElementById('insp');
  const found = selected && findClip(selected);
  if(!found){
    box.innerHTML = `<div class="none">select a clip to set its pages, gain and looping ·
      drag sound out of the bay onto a layer to make one</div>`;
    return;
  }
  const {c, l} = found;
  const locked = l.locked;
  box.innerHTML = `
    <div style="min-width:0">
      <div class="insptitle">${esc(c.name)}</div>
      <div class="inspgrid" style="margin-top:var(--s2)">
        <label class="f"><span class="k">layer</span>
          <select ${locked ? 'disabled' : ''} data-move-layer>
            ${LAYERS.filter(x => !x.locked).map(x => `<option value="${x.id}"
              ${x.id === l.id ? 'selected' : ''}>${esc(x.name)} · ${KIND_WORD[x.kind]}</option>`).join('')}
          </select></label>
        <label class="f"><span class="k">from page</span>
          <input type="number" min="1" max="${PAGES}" value="${c.from}"
            ${locked ? 'disabled' : ''} data-from></label>
        <label class="f"><span class="k">to page</span>
          <input type="number" min="1" max="${PAGES}" value="${c.to}"
            ${locked ? 'disabled' : ''} data-to></label>
        <label class="f"><span class="k">gain ${c.gain > 0 ? '+' : ''}${c.gain} db</span>
          <input type="range" min="-24" max="12" step="1" value="${c.gain}"
            ${locked ? 'disabled' : ''} data-gain></label>
        <div class="f"><span class="k">length</span><span class="v">${esc(c.dur)}</span></div>
        <div class="f"><span class="k">covers</span>
          <span class="v">${c.to - c.from + 1} page${c.to - c.from ? 's' : ''}</span></div>
      </div>
    </div>
    <div class="inspacts">
      <button class="prev" data-playclip data-dur="8" title="preview">${PLAY}</button>
      ${locked ? '<span class="none">turned in by a performer</span>' : `
        <button class="btn sm" data-loop aria-pressed="${c.loop}">loop</button>
        <button class="btn sm" data-del>remove</button>`}
    </div>`;
}

/* ============================================================
   moving and resizing. a clip is dragged by page, never by pixel: the
   grid is the unit, so a range always lands on whole pages.
   ============================================================ */
let drag = null;
document.getElementById('sheet').addEventListener('pointerdown', e => {
  const lane = e.target.closest('.lane');
  /* placing an armed bay clip happens on the press, not on the click: while a
     drag has the pointer captured the click is retargeted to the sheet and a
     lane can no longer be resolved from it. */
  if(bayPick && lane){
    addClip(bayPick, lane.dataset.layer, pageAt(lane, e.clientX));
    return;
  }
  const clip = e.target.closest('.clip');
  if(!clip) return;
  const {c, l} = findClip(clip.dataset.clip);
  /* select in place rather than re-rendering: rebuilding the sheet under a
     pointer that is still down eats the click that follows it. */
  selected = c.id;
  document.querySelectorAll('.clip').forEach(el =>
    el.setAttribute('aria-selected', el.dataset.clip === selected));
  paintInspector();
  if(l.locked) return;
  const grip = e.target.closest('[data-grip]');
  drag = {id:c.id, mode:grip ? grip.dataset.grip : 'move', startX:e.clientX,
          from0:c.from, to0:c.to};
  /* no preventDefault here: it would suppress the click that follows, and a
     click on a lane is how an armed bay clip gets placed. text selection is
     already off on .clip. */
  document.getElementById('sheet').setPointerCapture(e.pointerId);
});
document.getElementById('sheet').addEventListener('pointermove', e => {
  if(!drag) return;
  const {c, l} = findClip(drag.id);
  const d = Math.round((e.clientX - drag.startX) / col);
  if(!d && drag.mode !== 'move') return;
  if(drag.mode === 'move'){
    const len = drag.to0 - drag.from0;
    let from = Math.min(Math.max(1, drag.from0 + d), PAGES - len);
    if(from === c.from) return;
    c.from = from; c.to = from + len;
  }else if(drag.mode === 'l'){
    const from = Math.min(Math.max(1, drag.from0 + d), c.to);
    if(from === c.from) return;
    c.from = from;
  }else{
    const to = Math.max(Math.min(PAGES, drag.to0 + d), c.from);
    if(to === c.to) return;
    c.to = to;
  }
  if(l.kind === 'oneshot') c.to = c.from;   // an effect belongs to one page
  render();
});
addEventListener('pointerup', () => {
  if(!drag) return;
  const {c} = findClip(drag.id);
  if(c.from !== drag.from0 || c.to !== drag.to0)
    toast(`${c.name} · pages ${c.from}–${c.to}`);
  drag = null;
});

/* ---------- clicks on the sheet ---------- */
document.getElementById('sheet').addEventListener('click', e => {
  const rc = e.target.closest('[data-page]');
  if(rc){ page = +rc.dataset.page; render(); return; }
  const mute = e.target.closest('[data-mute]');
  if(mute){
    const l = LAYERS.find(x => x.id === mute.dataset.mute);
    l.muted = !l.muted;
    render();
    toast(`${l.name} ${l.muted ? 'muted' : 'unmuted'}`);
    return;
  }
});

/* ---------- the bay ---------- */
function renderBay(){
  document.getElementById('bay-n').textContent = BAY.length ? `${BAY.length} files` : '';
  document.getElementById('baylist').innerHTML = BAY.length
    ? BAY.map(b => `
      <div class="cliprow${b.used ? ' used' : ''}" draggable="true" data-bay="${b.id}"
           aria-grabbed="${bayPick === b.id}">
        <button class="prev" data-playbay="${b.id}" data-dur="6" title="play">${PLAY}</button>
        <span class="nm mq"><span>${esc(b.name)}</span></span>
        <span class="meta">${esc(b.dur)}</span>
      </div>`).join('')
    : `<div class="bayempty"><b>drop sound here</b>
        music, ambience, effects · drag it onto a layer to give it pages</div>`;
}
document.getElementById('baylist').addEventListener('click', e => {
  const play = e.target.closest('[data-playbay]');
  if(play){ play_(play, +play.dataset.dur); return; }
  const row = e.target.closest('[data-bay]');
  if(!row) return;
  bayPick = bayPick === row.dataset.bay ? null : row.dataset.bay;
  renderBay();
  toast(bayPick ? 'now click the layer and page it starts on' : 'nothing armed');
});
document.getElementById('baylist').addEventListener('dragstart', e => {
  const row = e.target.closest('[data-bay]');
  if(!row) return;
  e.dataTransfer.setData('text/plain', row.dataset.bay);
  e.dataTransfer.effectAllowed = 'copy';
});
document.getElementById('sheet').addEventListener('dragover', e => {
  const lane = e.target.closest('.lane');
  if(!lane) return;
  e.preventDefault();
  document.querySelectorAll('.lane.dropping').forEach(l => l.classList.remove('dropping'));
  lane.classList.add('dropping');
});
document.getElementById('sheet').addEventListener('dragleave', e => {
  const lane = e.target.closest('.lane');
  if(lane) lane.classList.remove('dropping');
});
document.getElementById('sheet').addEventListener('drop', e => {
  const lane = e.target.closest('.lane');
  if(!lane) return;
  e.preventDefault();
  lane.classList.remove('dropping');
  addClip(e.dataTransfer.getData('text/plain'), lane.dataset.layer, pageAt(lane, e.clientX));
});

/* dropping a file straight onto a lane is the same act as dropping it in the
   bay and dragging it out again, so it does both in one go. */
function addClip(bayId, layerId, from){
  const b = BAY.find(x => x.id === bayId);
  const l = LAYERS.find(x => x.id === layerId);
  if(!b || !l || l.locked) return;
  const span = l.kind === 'oneshot' ? 0 : l.kind === 'bed' ? Math.min(PAGES - from, 11) : 7;
  const c = {id:'c' + Math.random().toString(36).slice(2, 7), name:b.name.replace(/\.[a-z0-9]+$/i, ''),
             from, to:Math.min(PAGES, from + span), gain:l.kind === 'bed' ? -8 : 0,
             loop:l.kind !== 'oneshot', dur:b.dur};
  l.clips.push(c);
  b.used = true;
  bayPick = null;
  selected = c.id;
  render(); renderBay();
  toast(`${c.name} · ${l.name} · pages ${c.from}–${c.to}`);
}

function bayAdd(files){
  let n = 0;
  [...files].forEach(f => {
    if(f.type && !f.type.startsWith('audio')) return;
    const b = {id:'b' + Math.random().toString(36).slice(2, 7), name:f.name,
               dur:'· · ·', kind:'score', used:false};
    BAY.push(b); n++;
    const a = new Audio();
    a.preload = 'metadata';
    a.onloadedmetadata = () => {
      if(isFinite(a.duration))
        b.dur = `${Math.floor(a.duration/60)}:${String(Math.floor(a.duration%60)).padStart(2,'0')}`;
      renderBay();
    };
    a.src = URL.createObjectURL(f);
  });
  renderBay();
  if(n) toast(`${n} file${n === 1 ? '' : 's'} in the bay`);
}
document.getElementById('bay-add').addEventListener('click', () =>
  document.getElementById('filein').click());
document.getElementById('filein').addEventListener('change', e => {
  bayAdd(e.target.files); e.target.value = '';
});
let dragDepth = 0;
addEventListener('dragenter', e => {
  if(![...(e.dataTransfer.types || [])].includes('Files')) return;
  dragDepth++;
  document.getElementById('droplayer').classList.add('on');
});
addEventListener('dragover', e => {
  if([...(e.dataTransfer.types || [])].includes('Files')) e.preventDefault();
});
addEventListener('dragleave', () => {
  if(--dragDepth <= 0){ dragDepth = 0; document.getElementById('droplayer').classList.remove('on'); }
});
addEventListener('drop', e => {
  if(![...(e.dataTransfer.types || [])].includes('Files')) return;
  e.preventDefault();
  dragDepth = 0;
  document.getElementById('droplayer').classList.remove('on');
  bayAdd(e.dataTransfer.files);
});

/* ---------- the inspector's controls ---------- */
document.getElementById('insp').addEventListener('input', e => {
  const found = findClip(selected);
  if(!found) return;
  const {c, l} = found;
  if(e.target.matches('[data-from]')){
    c.from = Math.min(Math.max(1, +e.target.value || 1), c.to);
    if(l.kind === 'oneshot') c.to = c.from;
    render();
  }
  if(e.target.matches('[data-to]')){
    c.to = Math.max(Math.min(PAGES, +e.target.value || 1), c.from);
    render();
  }
  if(e.target.matches('[data-gain]')){
    c.gain = +e.target.value;
    paintInspector();
  }
});
document.getElementById('insp').addEventListener('change', e => {
  const found = findClip(selected);
  if(!found || !e.target.matches('[data-move-layer]')) return;
  const {c, l} = found;
  const to = LAYERS.find(x => x.id === e.target.value);
  if(!to || to === l) return;
  l.clips.splice(l.clips.indexOf(c), 1);
  if(to.kind === 'oneshot') c.to = c.from;
  to.clips.push(c);
  render();
  toast(`moved to ${to.name}`);
});
document.getElementById('insp').addEventListener('click', e => {
  const found = findClip(selected);
  if(!found) return;
  const {c, l} = found;
  if(e.target.closest('[data-playclip]')){ play_(e.target.closest('[data-playclip]'), 8); return; }
  if(e.target.closest('[data-loop]')){ c.loop = !c.loop; render(); return; }
  if(e.target.closest('[data-del]')){
    l.clips.splice(l.clips.indexOf(c), 1);
    selected = null;
    render();
    toast(`${c.name} removed`);
  }
});

/* ---------- add a layer ---------- */
document.querySelector('.addlane').addEventListener('click', e => {
  const b = e.target.closest('[data-add]');
  if(!b) return;
  const kind = b.dataset.add;
  const n = LAYERS.filter(l => l.kind === kind).length + 1;
  LAYERS.splice(LAYERS.length - 1, 0, {
    id:'L' + Math.random().toString(36).slice(2, 6),
    name:`${KIND_WORD[kind]} ${n}`, kind, volume:kind === 'bed' ? 40 : 100,
    duck:kind === 'bed' ? 'off' : 'medium', muted:false, clips:[]
  });
  render();
  toast(`layer added · drag sound onto it`);
});

/* ---------- fit the whole comic across the sheet ---------- */
document.getElementById('fit').addEventListener('click', e => {
  const w = document.getElementById('hscroll').clientWidth - 8;
  col = col === 52 ? Math.max(12, Math.floor(w / PAGES)) : 52;
  e.currentTarget.setAttribute('aria-pressed', col !== 52);
  e.currentTarget.textContent = col === 52 ? 'fit pages' : 'page columns';
  render();
});

/* ---------- playback ---------- */
let playing = null, playTimer;
function stopPlay(){
  if(!playing) return;
  playing.classList.remove('playing');
  playing.innerHTML = PLAY;
  playing = null;
}
function play_(btn, secs){
  if(playing && playing !== btn) stopPlay();
  clearTimeout(playTimer);
  if(btn.classList.contains('playing')){ stopPlay(); return; }
  btn.style.setProperty('--prev-t', secs + 's');
  btn.innerHTML = PAUSE + '<i></i>';
  requestAnimationFrame(() => btn.classList.add('playing'));
  playing = btn;
  playTimer = setTimeout(stopPlay, secs * 1000);
}

document.getElementById('publish').addEventListener('click', () => {
  const silent = [];
  for(let p = 1; p <= PAGES; p++)
    if(!LAYERS.some(l => l.kind !== 'voice' && !l.muted &&
        l.clips.some(c => p >= c.from && p <= c.to))) silent.push(p);
  toast(silent.length
    ? `published · ${silent.length} page${silent.length === 1 ? '' : 's'} with nothing under them`
    : 'published · every page has sound');
});

/* ---------- hotkeys ---------- */
addEventListener('keydown', e => {
  if(e.target.matches('input,textarea,select')) return;
  const found = findClip(selected);
  if(!found) return;
  const {c, l} = found;
  if(l.locked) return;
  const len = c.to - c.from;
  if(e.key === 'ArrowLeft'){ e.preventDefault();
    if(c.from > 1){ c.from--; c.to = c.from + len; render(); } return; }
  if(e.key === 'ArrowRight'){ e.preventDefault();
    if(c.to < PAGES){ c.from++; c.to = c.from + len; render(); } return; }
  if(e.key === ',' && l.kind !== 'oneshot'){ e.preventDefault();
    if(c.to > c.from){ c.to--; render(); } return; }
  if(e.key === '.' && l.kind !== 'oneshot'){ e.preventDefault();
    if(c.to < PAGES){ c.to++; render(); } return; }
  if(e.key === 'l' || e.key === 'L'){ e.preventDefault(); c.loop = !c.loop; render(); return; }
  if(e.key === 'Backspace' || e.key === 'Delete'){
    e.preventDefault();
    l.clips.splice(l.clips.indexOf(c), 1);
    selected = null;
    render();
    toast(`${c.name} removed`);
  }
});

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1700);
}

render();
renderBay();
</script>
</body>
</html>
