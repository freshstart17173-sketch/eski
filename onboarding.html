<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eski — set up your account</title>
<meta name="description" content="claim your handle on eski.">
<link rel="icon" type="image/png" href="eski_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="palette.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="palettes.css">
<link rel="stylesheet" href="pivot.css">
<script type="module" src="platform.js"></script>
<style>
/* eski — onboarding. accountCard from artboard.html, as a real page rather
   than a modal: there's nothing to layer over here, this IS the
   destination after first sign-in, so the card sits centred on a plain
   page instead of a scrim. Same header every pivot page uses, so nobody
   lands here with no way to navigate. */
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:var(--fs)}
*{box-sizing:border-box}
.center{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 64px);padding:32px}
.err{color:var(--danger);font-size:12.5px;min-height:1em}
[hidden]{display:none!important}
</style>
</head>
<body>

<header class="pivot-top site-header">
  <a class="mark wordmark" href="index.html">eski<i>!</i></a>
  <nav>
    <button class="navlink" type="button" data-go="index.html">Home</button>
    <button class="navlink" type="button" data-go="profile.html">Profile</button>
  </nav>
</header>

<div class="center">
  <div class="pv-card" style="width:460px;padding:40px 36px;display:flex;flex-direction:column;gap:16px;" id="card">
    <div style="font-size:13.5px;color:var(--muted);">loading…</div>
  </div>
</div>

<script>
function esc(s){ return (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function handleSeed(user){
  const m = user.user_metadata || {};
  const raw = m.user_name || m.name || m.full_name || (user.email||'').split('@')[0] || 'reader';
  const base = raw.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24);
  return base.length >= 3 ? base : 'reader';
}
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => location.href = b.dataset.go));

async function platform(){
  if(!window.eski && document.readyState === 'loading')
    await new Promise(r => document.addEventListener('DOMContentLoaded', r, { once: true }));
  return window.eski || null;
}

(async function load(){
  const card = document.getElementById('card');
  const eski = await platform();
  const sb = eski && await eski.ready;
  if(!sb){
    const why = (eski && eski.bootError) || 'ESK-1005 platform.js did not load at all';
    card.innerHTML = `<div style="font-size:13.5px;color:var(--soft-ink);line-height:1.5;">could not reach the server.<br><br>${esc(why)}</div>`;
    return;
  }
  const me = (await sb.auth.getUser()).data.user || null;
  if(!me){
    card.innerHTML = `<div class="wordmark" style="font-size:28px;">eski<i>!</i></div>
      <div style="font-size:13.5px;color:var(--soft-ink);line-height:1.5;">sign in first, then come back here to set up your handle.</div>`;
    return;
  }

  const existing = await sb.from('profiles').select('handle').eq('id', me.id).maybeSingle();
  if(existing.data){
    location.replace(new URLSearchParams(location.search).get('next') || 'index.html');
    return;
  }

  const m = me.user_metadata || {};
  const avatar = m.avatar_url || null;
  const seed = handleSeed(me);
  const displayName = m.full_name || m.name || m.user_name || '';

  card.innerHTML = `
    <div class="wordmark" style="font-size:28px;">eski<i>!</i></div>
    <div style="font-weight:700;font-size:22px;color:var(--ink);">Set up your account</div>
    <div style="font-size:13px;color:var(--soft-ink);line-height:1.5;">your handle is how people find your work. you can change it later.</div>
    <div class="ufield"><div class="ulabel">handle</div><input class="uinput" id="f-handle" maxlength="30" value="${esc(seed)}" autocomplete="off"></div>
    <div class="ufield"><div class="ulabel">display name</div><input class="uinput" id="f-name" maxlength="60" value="${esc(displayName)}" placeholder="optional"></div>
    <div class="ufield"><div class="ulabel">bio</div><textarea class="utext" id="f-bio" maxlength="400" placeholder="what you make, in a sentence…"></textarea></div>
    <div class="err" id="f-err"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px;">
      <a class="btnline" href="index.html" style="text-decoration:none;display:inline-flex;align-items:center;">Skip for now</a>
      <button class="btnline filled" type="button" id="f-submit">Create account</button>
    </div>`;

  document.getElementById('f-submit').addEventListener('click', async () => {
    const err = document.getElementById('f-err');
    err.textContent = '';
    const handle = document.getElementById('f-handle').value.trim().toLowerCase();
    if(!/^[a-z0-9](?:[a-z0-9_-]{1,28}[a-z0-9])$/.test(handle)){
      err.textContent = 'handles are 3 to 30 characters: letters, numbers, - and _, not at the ends.';
      return;
    }
    const btn = document.getElementById('f-submit');
    btn.disabled = true;
    const ins = await sb.from('profiles').insert({
      id: me.id, handle,
      display_name: document.getElementById('f-name').value.trim() || null,
      bio: document.getElementById('f-bio').value.trim() || null,
      avatar_url: avatar
    }).select('*').single();
    btn.disabled = false;
    if(ins.error){
      err.textContent = ins.error.code === '23505' ? 'that handle is taken. try another.'
        : eski.dbError('ESK-5026', 'your account could not be created', ins.error);
      return;
    }
    location.replace(new URLSearchParams(location.search).get('next') || 'index.html');
  });
})();
</script>
</body>
</html>
