<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eski — set up your account</title>
<meta name="description" content="claim your handle on eski.">
<link rel="icon" type="image/png" href="eski_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script type="module" src="platform.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="docs/design/final/broadsheet.css">
<style>
/* ============================================================
   eski — onboarding. a deliberate account-setup step instead of the
   silent auto-seeded handle profile.html's ensureProfile() falls back
   to. one form, one job: pick a handle before the shelf opens.
   ============================================================ */
body{margin:0;min-height:100vh;display:flex;flex-direction:column}
.top nav a,.top nav button{font:inherit;font-size:var(--fs-micro);letter-spacing:.14em;
  text-transform:lowercase;cursor:pointer;line-height:1.2}
.top .sp{flex:1}
.auth{margin-left:var(--s4)}
.auth-btn{font-size:var(--fs-micro)!important;letter-spacing:.1em!important;
  text-transform:lowercase!important;border-color:var(--rule-hair)!important}

.wrap{max-width:520px;margin:0 auto;padding:var(--s8) var(--s4) var(--s7);flex:1;width:100%}
.eyebrow{font-size:var(--fs-micro);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--font-display);font-weight:400;font-size:var(--fs-title);
  margin:var(--s2) 0 0;line-height:1.1}
.lede{margin:var(--s3) 0 0;color:var(--soft-ink);font-size:var(--fs-xs);line-height:1.6;max-width:46ch}

.who{display:flex;align-items:center;gap:var(--s3);margin:var(--s6) 0 var(--s5)}
.pfp{width:48px;height:48px;border:1px solid var(--rule);flex:none;overflow:hidden;
  display:grid;place-items:center;font-family:var(--font-display);font-size:18px;
  color:var(--accent);background:var(--surface)}
.pfp img{width:100%;height:100%;object-fit:cover}
.who span{font-size:var(--fs-xs);color:var(--label)}

form{display:flex;flex-direction:column;gap:var(--s4)}
label{font-size:var(--fs-micro);letter-spacing:.12em;color:var(--label);
  text-transform:uppercase;font-weight:500}
.field{display:flex;flex-direction:column;gap:var(--s1)}
.at{position:relative}
.at input{padding-left:22px!important}
.at::before{content:"@";position:absolute;left:var(--s3);top:50%;transform:translateY(-50%);
  color:var(--label);font-size:var(--fs-xs)}
input,textarea{width:100%;padding:var(--s2) var(--s3);border:1px solid var(--rule-hair);
  background:var(--paper);color:var(--ink);font:inherit;font-size:var(--fs-xs);box-sizing:border-box}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:72px;resize:vertical}
.hint{font-size:10px;color:var(--label);letter-spacing:.02em}
.err{color:var(--rec);font-size:var(--fs-xs);min-height:1em}

.acts{display:flex;align-items:center;gap:var(--s4);margin-top:var(--s2)}
.btn.p{min-width:160px}
.skip{font-size:var(--fs-micro);letter-spacing:.08em;color:var(--label);
  text-decoration:none;text-transform:lowercase}
.skip:hover{color:var(--ink)}

.state{padding:var(--s7) 0;color:var(--label);font-size:var(--fs-xs);line-height:1.6}
.state a{color:var(--accent)}
</style>
</head>
<body>

<header class="top site-header">
  <a class="mark" href="index.html">eski<i>!</i></a>
  <nav id="nav">
    <button data-pane="home" aria-current="page">home</button>
    <button data-pane="browse">browse</button>
    <a href="profile.html">profile</a>
  </nav>
</header>

<div class="wrap" id="page">
  <div class="eyebrow">one more step</div>
  <h1>set up your account</h1>
  <p class="lede">your handle is the address your work lives under — bylines, follows,
    comments, credit. pick one now; you can change it later from your profile.</p>
  <div id="body"></div>
</div>

<script>
function esc(s){ return (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function handleSeed(user){
  const m = user.user_metadata || {};
  const raw = m.user_name || m.name || m.full_name || (user.email||'').split('@')[0] || 'reader';
  const base = raw.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24);
  return base.length >= 3 ? base : 'reader';
}

async function platform(){
  if(!window.eski && document.readyState === 'loading')
    await new Promise(r => document.addEventListener('DOMContentLoaded', r, { once: true }));
  return window.eski || null;
}

(async function load(){
  const body = document.getElementById('body');
  const eski = await platform();
  const sb = eski && await eski.ready;
  if(!sb){
    const why = (eski && eski.bootError) || 'ESK-1005 platform.js did not load at all';
    body.innerHTML = '<div class="state">could not reach the server.<br><br>' + esc(why) + '</div>';
    return;
  }
  const me = (await sb.auth.getUser()).data.user || null;
  if(!me){
    body.innerHTML = '<div class="state">sign in first, then come back here to set up your handle.</div>';
    return;
  }

  const existing = await sb.from('profiles').select('handle').eq('id', me.id).maybeSingle();
  if(existing.data){
    location.replace(new URLSearchParams(location.search).get('next') || 'index.html');
    return;
  }

  const m = me.user_metadata || {};
  const avatar = m.avatar_url || null;
  const seed = handleSeed(me);
  const displayName = m.full_name || m.name || m.user_name || '';
  const initial = (displayName || seed || '?').trim().charAt(0).toLowerCase();

  body.innerHTML = `
    <div class="who">
      <div class="pfp">${avatar ? `<img src="${esc(avatar)}" alt="">` : esc(initial)}</div>
      <span>signed in as ${esc(displayName || me.email || 'you')}</span>
    </div>
    <form id="f">
      <div class="field">
        <label for="f-handle">handle</label>
        <div class="at"><input id="f-handle" maxlength="30" value="${esc(seed)}" autocomplete="off"></div>
        <span class="hint">3–30 characters: lowercase letters, numbers, - and _, not at the ends.</span>
      </div>
      <div class="field">
        <label for="f-name">display name</label>
        <input id="f-name" maxlength="60" value="${esc(displayName)}" placeholder="optional">
      </div>
      <div class="field">
        <label for="f-bio">bio</label>
        <textarea id="f-bio" maxlength="400" placeholder="what you make, or what you're into. optional."></textarea>
      </div>
      <div class="err" id="f-err"></div>
      <div class="acts">
        <button type="submit" class="btn p">create account</button>
        <a class="skip" id="skip" href="index.html">skip for now →</a>
      </div>
    </form>`;

  document.getElementById('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const err = document.getElementById('f-err');
    err.textContent = '';
    const handle = document.getElementById('f-handle').value.trim().toLowerCase();
    if(!/^[a-z0-9](?:[a-z0-9_-]{1,28}[a-z0-9])$/.test(handle)){
      err.textContent = 'handles are 3 to 30 characters: letters, numbers, - and _, not at the ends.';
      return;
    }
    const btn = ev.target.querySelector('button[type=submit]');
    btn.disabled = true;
    const ins = await sb.from('profiles').insert({
      id: me.id, handle,
      display_name: document.getElementById('f-name').value.trim() || null,
      bio: document.getElementById('f-bio').value.trim() || null,
      avatar_url: avatar
    }).select('*').single();
    btn.disabled = false;
    if(ins.error){
      err.textContent = ins.error.code === '23505' ? 'that handle is taken. try another.'
        : eski.dbError('ESK-5026', 'your account could not be created', ins.error);
      return;
    }
    location.replace(new URLSearchParams(location.search).get('next') || 'index.html');
  });
})();
</script>
</body>
</html>
