<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eski — profile</title>
<!-- this page also answers at /u/<handle>; see vercel.json's rewrite -->
<link rel="icon" type="image/png" href="eski_logo.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="palette.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="palettes.css">
<link rel="stylesheet" href="pivot.css">
<script type="module" src="platform.js"></script>
<script src="pivot.js"></script>
<style>
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:var(--fs)}
*{box-sizing:border-box}
main{max-width:var(--wrap);margin:0 auto}
.phead{display:flex;flex-direction:column;gap:20px;width:100%;padding:32px 32px 24px 32px}
.prow{display:flex;flex-direction:row;align-items:center;gap:24px}
.pavatar{width:72px;height:72px;background:var(--surface);flex-shrink:0;
  overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:var(--muted)}
.pavatar img{width:100%;height:100%;object-fit:cover}
.pstats{display:flex;gap:32px;flex-shrink:0}
.pstat{display:flex;flex-direction:column;align-items:center;gap:2px}
.pstat b{font-family:var(--font-body);font-weight:700;font-size:20px;color:var(--ink)}
.pstat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ptabs{display:flex;flex-direction:row;gap:24px;width:100%;padding:0 32px}
.gridwrap{padding:24px 32px 48px 32px}
.tabpanel{display:none;flex-direction:column;gap:16px}
.tabpanel.active{display:flex}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:96px 32px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink);font-size:var(--fs-lg)}
.settingsmax{max-width:640px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:400;
  background:var(--ink);color:var(--paper);font-size:13px;padding:10px 18px;max-width:min(90vw,520px);
  box-shadow:0 8px 30px rgba(0,0,0,.3)}
[hidden]{display:none!important}
</style>
</head>
<body>

<header class="pivot-top site-header">
  <a class="mark wordmark" href="index.html">eski<i>!</i></a>
  <nav>
    <button class="navlink" type="button" data-go="index.html" data-authed hidden>Home</button>
    <button class="navlink active" type="button" data-nav="profile" data-authed hidden>Profile</button>
    <button class="btnline filled" type="button" data-open-upload data-authed hidden>Upload</button>
  </nav>
</header>

<main id="main" hidden>
  <div class="phead">
    <div class="prow">
      <div class="pavatar" id="pavatar"></div>
      <div style="display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;">
        <div style="font-weight:700;font-size:22px;color:var(--ink);line-height:1.1;" id="pname"></div>
        <div style="font-size:13.5px;color:var(--muted);" id="phandle"></div>
      </div>
      <div class="pstats">
        <div class="pstat"><b id="stat-posts">&mdash;</b><span>posts</span></div>
        <div class="pstat"><b id="stat-followers">&mdash;</b><span>followers</span></div>
        <div class="pstat"><b id="stat-following">&mdash;</b><span>following</span></div>
      </div>
      <button class="btnline" type="button" id="prow-action" hidden></button>
      <button class="navarrow" type="button" id="prow-report" title="Report" hidden>&#9873;</button>
    </div>
    <div style="font-size:14px;color:var(--soft-ink);line-height:1.6;max-width:680px;" id="pbio"></div>
  </div>
  <div class="ptabs">
    <button class="dtab active" type="button" data-ptab="posts">Posts</button>
    <button class="dtab" type="button" data-ptab="saved" id="tab-saved" hidden>Saved</button>
    <button class="dtab" type="button" data-ptab="settings" id="tab-settings" hidden>Settings</button>
  </div>
  <div class="gridwrap">
    <div class="tabpanel active" data-panel="posts">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="font-size:13px;color:var(--muted);" id="posts-count-line"></div>
        <button class="btnline" type="button" id="create-collection" hidden style="display:flex;align-items:center;gap:8px;">
          <svg viewBox="0 0 24 24" width="15" height="15" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;"><path d="M12 5v14M5 12h14"/></svg>Create collection</button>
      </div>
      <div class="fgrid" id="posts-grid"></div>
      <div class="empty" id="posts-empty" hidden><b>Nothing here yet</b></div>
    </div>
    <div class="tabpanel" data-panel="saved">
      <div style="font-size:13px;color:var(--muted);">your saved folders</div>
      <div class="fgrid" id="saved-grid"></div>
      <div class="empty" id="saved-empty" hidden><b>Nothing saved yet</b><span>Save a post from anywhere and it lands here.</span></div>
    </div>
    <div class="tabpanel settingsmax" data-panel="settings" id="settings-panel"></div>
  </div>
</main>
<div class="empty" id="no-subject" hidden><b id="no-subject-msg">Profile not found</b></div>

<div id="overlay-root"></div>
<div id="toast-root"></div>

<script>
/* eski profile. real data against schema-clean.sql: profiles, works,
   follows, save_folders/save_folder_items, delete_my_account(). Shares
   pivot.js/pivot.css with index.html rather than redefining any of it —
   the detail overlay, the upload modal, sign-in, and card rendering are
   the exact same code both pages use. */
const P = window.Pivot;
let subject = null;    // the profiles row being shown
let isMe = false;

function wantedHandle(){
  return (location.pathname.match(/^\/u\/([^/]+)\/?$/) || [])[1]
      || new URLSearchParams(location.search).get('u');
}

async function boot(){
  await P.init(() => { if(document.getElementById('main').hidden === false) refresh(); });
  const sb = P.sb;
  const handle = wantedHandle();

  if(handle){
    const { data } = await sb.from('profiles').select('*').eq('handle', handle.toLowerCase()).maybeSingle();
    subject = data;
    isMe = !!(P.user && subject && subject.id === P.user.id);
  } else if(P.user){
    subject = P.myProfile;
    isMe = true;
    if(!subject){
      document.getElementById('no-subject-msg').innerHTML =
        'Finish setting up your account — <a href="onboarding.html" style="color:var(--accent);">pick a handle</a>.';
      document.getElementById('no-subject').hidden = false;
      return;
    }
  } else {
    document.getElementById('no-subject-msg').innerHTML =
      'Sign in to see your profile, or open someone\'s at /u/&lt;handle&gt;.';
    document.getElementById('no-subject').hidden = false;
    return;
  }
  if(!subject){
    document.getElementById('no-subject').hidden = false;
    return;
  }

  document.getElementById('main').hidden = false;
  wireTabs();
  renderHead();
  wireProwAction();
  document.getElementById('tab-saved').hidden = !isMe;
  document.getElementById('tab-settings').hidden = !isMe;
  document.getElementById('create-collection').hidden = !isMe;
  await loadStats();
  await loadPosts();
  if(isMe){
    document.getElementById('create-collection').addEventListener('click', createCollection);
    await loadSaved();
    renderSettings();
  }
}
document.addEventListener('DOMContentLoaded', boot);

/* re-derive isMe and refresh the bits that depend on who's signed in —
   NOT a location.reload(): supabase's onAuthStateChange fires once on
   subscribe even with no real change, and reloading from inside that
   handler reloads into a fresh subscribe that fires again. */
async function refresh(){
  isMe = !!(P.user && subject && subject.id === P.user.id);
  wireProwAction();
  document.getElementById('tab-saved').hidden = !isMe;
  document.getElementById('tab-settings').hidden = !isMe;
  document.getElementById('create-collection').hidden = !isMe;
  await loadStats();
  await loadPosts();
  if(isMe){ await loadSaved(); renderSettings(); }
}

function wireTabs(){
  document.querySelectorAll('[data-ptab]').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('[data-ptab]').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.tabpanel').forEach(p => p.classList.remove('active'));
    document.querySelector(`[data-panel="${t.dataset.ptab}"]`).classList.add('active');
  }));
}
function renderHead(){
  const av = document.getElementById('pavatar');
  av.innerHTML = subject.avatar_url
    ? `<img src="${P.esc(subject.avatar_url)}" alt="">`
    : P.esc((subject.display_name || subject.handle || '?').trim().charAt(0).toUpperCase());
  document.getElementById('pname').textContent = subject.display_name || subject.handle;
  document.getElementById('phandle').textContent = '@' + subject.handle;
  document.getElementById('pbio').textContent = subject.bio || '';
}
function wireProwAction(){
  const btn = document.getElementById('prow-action');
  const reportBtn = document.getElementById('prow-report');
  if(isMe){
    btn.hidden = false; btn.textContent = 'Edit profile';
    btn.addEventListener('click', () => document.querySelector('[data-ptab="settings"]').click());
    reportBtn.hidden = true;
    return;
  }
  if(!P.user){ btn.hidden = true; reportBtn.hidden = true; return; }
  reportBtn.hidden = false;
  reportBtn.addEventListener('click', () => P.reportFlow('profile', subject.id));
  btn.hidden = false;
  const setLabel = on => { btn.textContent = on ? 'Following' : 'Follow'; btn.classList.toggle('filled', !on); };
  P.sb.from('follows').select('followee_id').eq('follower_id', P.user.id).eq('followee_id', subject.id).maybeSingle()
    .then(({ data }) => setLabel(!!data));
  btn.addEventListener('click', async () => {
    const following = btn.textContent === 'Following';
    const { error } = following
      ? await P.sb.from('follows').delete().eq('follower_id', P.user.id).eq('followee_id', subject.id)
      : await P.sb.from('follows').insert({ follower_id: P.user.id, followee_id: subject.id });
    if(error) return P.toast(P.eski.dbError('ESK-5110','the follow could not be updated', error));
    setLabel(!following);
    loadStats();
  });
}
async function loadStats(){
  const sb = P.sb;
  const [posts, followers, following] = await Promise.all([
    sb.from('works').select('id', { count:'exact', head:true }).eq('owner_id', subject.id).eq('status','published'),
    sb.from('follows').select('follower_id', { count:'exact', head:true }).eq('followee_id', subject.id),
    sb.from('follows').select('followee_id', { count:'exact', head:true }).eq('follower_id', subject.id)
  ]);
  document.getElementById('stat-posts').textContent = posts.count ?? 0;
  document.getElementById('stat-followers').textContent = followers.count ?? 0;
  document.getElementById('stat-following').textContent = following.count ?? 0;
}

/* ------------------------------------------------------------- posts */
async function loadPosts(){
  const sb = P.sb;
  let q = sb.from('works').select('*').eq('owner_id', subject.id).is('version_of', null)
    .order('created_at', { ascending:false }).limit(96);
  q = isMe ? q.in('status', ['published','private']) : q.eq('status','published');
  const { data, error } = await q;
  if(error){ P.toast(P.eski.dbError('ESK-5100','your posts could not load', error)); return; }
  const rows = data || [];
  const ids = rows.map(r => r.id);
  const combo = rows.filter(r => r.kind === 'combination').map(r => r.id);
  const { data: comboRows } = combo.length ? await sb.from('work_items').select('work_id').in('work_id', combo) : { data: [] };
  const countBy = {};
  (comboRows||[]).forEach(r => countBy[r.work_id] = (countBy[r.work_id]||0) + 1);
  rows.forEach(r => r._itemCount = countBy[r.id] || 0);
  document.getElementById('posts-count-line').textContent = rows.length + ' post' + (rows.length===1?'':'s');
  const postsGrid = document.getElementById('posts-grid');
  postsGrid.innerHTML = rows.map(P.cardHtml).join('');
  P.wireCardPreviews(postsGrid);
  document.getElementById('posts-empty').hidden = rows.length > 0;
}
function createCollection(){
  P.openPrompt('Name this collection', 'untitled', 'Create collection', async title => {
    const { error } = await P.sb.from('collections').insert({
      owner_id: P.user.id, owner_name: P.ownerName(), title,
      slug: P.slugify(title) + '-' + Date.now().toString(36).slice(-5), status: 'published'
    });
    if(error) return P.toast(P.eski.dbError('ESK-5105','the collection could not be created', error));
    P.toast('collection created — add posts to it from their detail overlay');
  });
}

/* ------------------------------------------------------------- saved */
async function loadSaved(){
  const grid = document.getElementById('saved-grid');
  const folders = P.myFolders;
  if(!folders.length){ grid.innerHTML = ''; document.getElementById('saved-empty').hidden = false; return; }
  document.getElementById('saved-empty').hidden = true;
  const { data: counts } = await P.sb.from('save_folder_items').select('folder_id')
    .in('folder_id', folders.map(f => f.id));
  const n = {};
  (counts||[]).forEach(r => n[r.folder_id] = (n[r.folder_id]||0) + 1);
  grid.innerHTML = folders.map(f => `<button class="gcard" type="button" data-openfolder="${f.id}">
    <div class="gbox framed"><div class="gcount" style="position:static;background:none;color:var(--ink);font-size:15px;font-weight:700;">${n[f.id]||0}</div></div>
    <div class="gcap">${P.esc(f.name)}</div></button>`).join('');
  grid.querySelectorAll('[data-openfolder]').forEach(b => b.addEventListener('click', () => openFolder(b.dataset.openfolder)));
}
async function openFolder(folderId){
  const folder = P.myFolders.find(f => f.id === folderId);
  const { data: items } = await P.sb.from('save_folder_items').select('target_id').eq('folder_id', folderId).eq('target_type','work');
  const ids = (items||[]).map(r => r.target_id);
  const { data: works } = ids.length ? await P.sb.from('works').select('*').in('id', ids) : { data: [] };
  const root = document.getElementById('overlay-root');
  root.innerHTML = `<div class="pv-scrim"><div class="pv-card" style="width:1100px;max-width:100%;max-height:85vh;display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:22px 28px 14px 28px;">
      <div style="font-weight:700;font-size:20px;color:var(--ink);">${P.esc(folder ? folder.name : 'Folder')}</div>
      <button class="navarrow" type="button" data-close-detail>&times;</button>
    </div>
    <div style="padding:0 28px 28px 28px;overflow:auto;">
      <div class="fgrid">${(works||[]).map(P.cardHtml).join('') || '<div style="color:var(--muted);font-size:13px;">nothing saved here yet</div>'}</div>
    </div>
  </div></div>`;
  root.querySelector('.pv-scrim').addEventListener('click', e => { if(e.target.classList.contains('pv-scrim')) root.innerHTML=''; });
  root.querySelector('[data-close-detail]').addEventListener('click', () => root.innerHTML = '');
}

/* ----------------------------------------------------------- settings */
/* every editable field is a live input from the moment Settings renders —
   no click-Edit-first step. Save starts disabled and lights up once the
   input differs from what's saved, one Save per field rather than one
   bulk save for the panel (so editing your bio can't accidentally also
   submit a half-typed handle). */
const SETTINGS_FIELDS = {
  name:   { label: 'Display name', get: () => subject.display_name || '', column: 'display_name', multiline: false },
  handle: { label: 'Handle',       get: () => subject.handle || '',       column: 'handle',       multiline: false },
  bio:    { label: 'Bio',          get: () => subject.bio || '',          column: 'bio',          multiline: true }
};
function fieldRowHtml(id){
  const field = SETTINGS_FIELDS[id];
  const val = field.get();
  const control = field.multiline
    ? `<textarea class="utext" id="field-${id}">${P.esc(val)}</textarea>`
    : `<input class="uinput" id="field-${id}" value="${P.esc(val)}">`;
  return `<div style="display:flex;flex-direction:column;gap:6px;padding:14px 8px;box-shadow:inset 0 -1px 0 var(--surface);" data-row="${id}">
    <div class="ulabel">${P.esc(field.label)}</div>
    <div style="display:flex;gap:8px;align-items:flex-start;">
      <div style="flex:1;min-width:0;">${control}</div>
      <button class="btnline filled" type="button" data-savefield="${id}" disabled style="padding:10px 16px;flex-shrink:0;">Save</button>
    </div>
  </div>`;
}
function wireFieldRow(id){
  const field = SETTINGS_FIELDS[id];
  const input = document.getElementById('field-' + id);
  const save = document.querySelector(`[data-savefield="${id}"]`);
  const original = field.get();
  input.addEventListener('input', () => { save.disabled = input.value === original; });
  if(!field.multiline) input.addEventListener('keydown', e => { if(e.key === 'Enter' && !save.disabled) saveField(id); });
  save.addEventListener('click', () => saveField(id));
}
async function saveField(id){
  const field = SETTINGS_FIELDS[id];
  const save = document.querySelector(`[data-savefield="${id}"]`);
  let value = document.getElementById('field-' + id).value.trim();
  if(id === 'handle'){
    value = value.toLowerCase();
    if(!/^[a-z0-9](?:[a-z0-9_-]{1,28}[a-z0-9])$/.test(value))
      return P.toast('a handle is lowercase letters, numbers, - and _, 3-30 characters');
  }
  save.disabled = true;
  const patch = { [field.column]: value || null };
  const { error } = await P.sb.from('profiles').update(patch).eq('id', subject.id);
  if(error){ save.disabled = false; return P.toast(P.eski.dbError('ESK-5111', error.code==='23505' ? 'that handle is taken' : 'settings could not be saved', error)); }
  Object.assign(subject, patch);
  if(id === 'handle') history.replaceState(null, '', '/u/' + encodeURIComponent(value));
  P.toast('saved');
  renderHead();
  renderSettings();
}
function renderSettings(){
  const panel = document.getElementById('settings-panel');
  panel.innerHTML = `
    <div style="display:flex;align-items:center;gap:16px;padding:14px 8px;box-shadow:inset 0 -1px 0 var(--surface);">
      <button class="pavatar" type="button" id="avatar-trigger" style="width:56px;height:56px;border:none;cursor:pointer;padding:0;">${subject.avatar_url ? `<img src="${P.esc(subject.avatar_url)}">` : P.esc((subject.display_name||subject.handle||'?').charAt(0).toUpperCase())}</button>
      <div style="flex:1;">
        <div class="ulabel" style="margin-bottom:6px;">Avatar</div>
        <button class="btnline" type="button" id="avatar-btn" style="padding:8px 14px;">Change photo</button>
        <input type="file" id="avatar-input" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
      </div>
    </div>
    ${fieldRowHtml('name')}
    ${fieldRowHtml('handle')}
    ${fieldRowHtml('bio')}
    <div style="display:flex;flex-direction:column;gap:2px;padding:14px 8px;box-shadow:inset 0 -1px 0 var(--surface);">
      <div class="ulabel">Email</div>
      <div style="font-size:14px;color:var(--soft-ink);">${P.esc((P.user && P.user.email) || '')}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:2px;padding:14px 8px;box-shadow:inset 0 -1px 0 var(--surface);">
      <div class="ulabel">Storage used</div>
      <div style="font-size:14px;color:var(--soft-ink);" id="storage-used">&mdash;</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;padding:14px 8px;box-shadow:inset 0 -1px 0 var(--surface);">
      <div class="ulabel">Theme</div>
      <div data-palette-picker></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:20px;">
      <button class="btnline danger" type="button" id="delete-account">Delete account</button>
      <button class="btnline" type="button" id="sign-out">Sign out</button>
    </div>`;

  ['name','handle','bio'].forEach(wireFieldRow);
  if(window.eskiTheme) window.eskiTheme.paint();
  P.sb.from('works').select('bytes').eq('owner_id', subject.id).then(({ data }) => {
    document.getElementById('storage-used').textContent =
      P.fmtBytes((data || []).reduce((sum, r) => sum + (r.bytes || 0), 0));
  });

  const avatarInput = document.getElementById('avatar-input');
  document.getElementById('avatar-trigger').addEventListener('click', () => avatarInput.click());
  document.getElementById('avatar-btn').addEventListener('click', () => avatarInput.click());
  avatarInput.addEventListener('change', async e => {
    const file = e.target.files[0];
    if(!file) return;
    const ext = (file.name.match(/\.([a-z0-9]+)$/i) || [,'png'])[1].toLowerCase();
    const path = P.user.id + '/avatar.' + ext;
    const { error: upErr } = await P.sb.storage.from('avatars').upload(path, file, { upsert:true, cacheControl:'60' });
    if(upErr) return P.toast(P.eski.dbError('ESK-5112','the avatar could not upload', upErr));
    const { data: pub } = P.sb.storage.from('avatars').getPublicUrl(path);
    const url = pub.publicUrl + '?t=' + Date.now();
    const { error } = await P.sb.from('profiles').update({ avatar_url: url }).eq('id', subject.id);
    if(error) return P.toast(P.eski.dbError('ESK-5112','the avatar could not save', error));
    subject.avatar_url = url;
    renderHead();
    P.toast('avatar updated');
  });

  document.getElementById('sign-out').addEventListener('click', async () => { await P.sb.auth.signOut(); location.href = 'index.html'; });
  document.getElementById('delete-account').addEventListener('click', () => {
    P.openConfirm('Delete your account?',
      'Your published work stays up, credited to &ldquo;Deleted account&rdquo;. This can\'t be undone.',
      'Delete account', async () => {
        const { data, error } = await P.sb.rpc('delete_my_account');
        if(error || !data || data.ok !== true) return P.toast(P.eski.dbError('ESK-5113','the account could not be deleted', error || { message: (data && data.why) || 'unknown' }));
        await P.sb.auth.signOut();
        location.href = 'index.html';
      });
  });
}
</script>
</body>
</html>
