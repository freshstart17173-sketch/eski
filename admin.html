<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/">
<title>eski admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="eski_logo.png">
<script type="module" src="platform.js"></script>
<script src="palette.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="palettes.css">
<style>
/* ============================================================
   eski — admin, rebuilt for the pivot (2026-08-15).

   DELIBERATELY PLAIN. It is not a product surface: no wordmark, no
   pivot.css. Monospace, one table style, every number where you can read
   it. Making it pretty would only make it slower to change.

   THE GATE IS NOT HERE. This page has no powers of its own — it can only
   do what the signed-in account is already allowed to do by the
   works_admin_*/collections_admin_*/comments_admin_*/reports_admin_*
   policies in schema-clean.sql. A page that merely hides its buttons is
   not a gate: anyone can open the console and run the same queries. So if
   you are not in `admins`, the database refuses every call this page
   makes, and the page says so rather than pretending to work.

   comics/parts/admin_overview()/admin_users() (the old shape) are gone
   with the comics-era schema. Overview's counts are plain admin-gated
   reads now — works_admin_read etc already exist, so no RPC is needed for
   them. Users still needs one (admin_users()): email/last_sign_in_at live
   in auth.users, which PostgREST never exposes directly, admin policy or
   not.
   ============================================================ */
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
a{color:var(--accent)}
header{display:flex;align-items:baseline;gap:16px;padding:10px 16px;
  border-bottom:2px solid var(--rule);position:sticky;top:0;background:var(--paper);z-index:5}
header b{font-size:15px}
header .sp{flex:1}
main{padding:16px;max-width:1500px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
  margin:28px 0 8px;font-weight:400}
h2:first-child{margin-top:0}

.tabs{display:flex;gap:2px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{font:inherit;background:none;color:var(--muted);border:1px solid var(--rule-hair);
  padding:5px 12px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--mark);color:var(--on-mark);border-color:var(--mark)}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:1px;
  background:var(--rule-hair);border:1px solid var(--rule-hair)}
.stats div{background:var(--paper);padding:10px 12px}
.stats b{display:block;font-size:22px;line-height:1.1;font-weight:500;
  font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.stats div.warn b{color:var(--danger)}

table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--rule-hair);
  vertical-align:top}
th{color:var(--muted);font-weight:400;text-transform:uppercase;font-size:10px;
  letter-spacing:.08em;position:sticky;top:44px;background:var(--paper)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:var(--surface)}
tr.csam{box-shadow:inset 3px 0 0 var(--danger)}
.wrap{overflow-x:auto}
.mono-id{color:var(--muted);font-size:10px}
.body{max-width:60ch;white-space:pre-wrap;word-break:break-word}

button.act{font:inherit;font-size:11px;background:none;border:1px solid var(--rule-hair);
  color:var(--ink);padding:2px 7px;cursor:pointer;margin-right:4px}
button.act:hover{border-color:var(--ink)}
button.act.danger{color:var(--danger);border-color:var(--danger)}
.pill{display:inline-block;padding:1px 6px;border:1px solid var(--rule-hair);
  font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pill.on{background:var(--mark);color:var(--on-mark);border-color:var(--mark)}
.pill.warn{color:var(--danger);border-color:var(--danger)}
.note{color:var(--muted);margin:8px 0}
.err{color:var(--danger);white-space:pre-wrap;border:1px solid var(--danger);padding:10px;margin:12px 0}
.gate{padding:48px 16px;max-width:60ch}
.gate h1{font-size:16px;margin:0 0 12px}
</style>
</head>
<body>
<header>
  <b>eski admin</b>
  <span id="who" class="note"></span>
  <span class="sp"></span>
  <a href="/">← the site</a>
</header>

<div id="app"><div class="gate"><p class="note">Checking…</p></div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString()
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const n = v => (v ?? 0).toLocaleString('en-US');
const when = d => d ? new Date(d).toISOString().slice(0,16).replace('T',' ') : '—';
const short = id => (id || '').slice(0, 8);

let sb = null, me = null, TAB = 'overview';

async function boot(){
  const eski = window.eski;
  if(!eski){ gate('ESK-1005 platform.js did not load.'); return; }
  sb = await eski.ready;
  me = eski.user;
  if(!sb){ gate(eski.bootError || 'ESK-1001 no client.'); return; }
  if(!me){ gate('Not signed in. Sign in on the main site first, then come back.'); return; }

  $('who').textContent = me.email || me.id;

  /* ASK THE DATABASE, not the page. is_admin() is the same function every
     policy calls, so this answer and the policies can never disagree. */
  const { data: ok, error } = await sb.rpc('is_admin');
  if(error){ gate('Could not check admin status: ' + error.message); return; }
  if(!ok){
    gate('This account is not an admin.\n\nAdmin is granted in SQL only — there is no ' +
         'button anywhere that adds one:\n\n  insert into admins (user_id, note)\n' +
         '  select id, \'why\' from auth.users where email = \'you@example.com\';');
    return;
  }
  render();
  load();
}

function gate(msg){
  $('app').innerHTML = `<div class="gate"><h1>No.</h1><p class="err">${esc(msg)}</p>
    <p class="note"><a href="/">Back to the site</a></p></div>`;
}

const TABS = [['overview','Overview'],['works','Works'],['collections','Collections'],
              ['comments','Comments'],['reports','Reports'],['users','Users']];

function render(){
  $('app').innerHTML = `<main>
    <div class="tabs">${TABS.map(([k,l])=>
      `<button data-tab="${k}" aria-selected="${k===TAB}">${l}</button>`).join('')}</div>
    <div id="panel"><p class="note">Loading…</p></div>
  </main>`;
  $('app').querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>{
    TAB = b.dataset.tab; render(); load();
  }));
}

function fail(where, e){
  $('panel').innerHTML = `<div class="err">${esc(where)}: ${esc((e && e.message) || e)}
${esc((e && e.code) ? '[' + e.code + ']' : '')}</div>`;
}

async function load(){
  try{
    if(TAB === 'overview')    return await loadOverview();
    if(TAB === 'works')       return await loadWorks();
    if(TAB === 'collections') return await loadCollections();
    if(TAB === 'comments')    return await loadComments();
    if(TAB === 'reports')     return await loadReports();
    if(TAB === 'users')       return await loadUsers();
  }catch(e){ fail('That did not load', e); }
}

/* ---------------------------------------------------------------- overview */
/* plain admin-gated counts, not admin_overview() — works_admin_read etc
   already let this account read everything, so a security-definer RPC
   would just be a second way to do what RLS already allows. */
async function loadOverview(){
  const count = async (table, filters) => {
    let q = sb.from(table).select('id', { count:'exact', head:true });
    for(const [k,v] of Object.entries(filters||{})) q = q.eq(k, v);
    const { count: c, error } = await q;
    if(error) throw error;
    return c;
  };
  const [works, published, drafts, priv, collections, comments, removed, openReports] = await Promise.all([
    count('works'), count('works', { status:'published' }), count('works', { status:'draft' }),
    count('works', { status:'private' }), count('collections'),
    count('comments'), sb.from('comments').select('id',{count:'exact',head:true}).not('deleted_at','is',null).then(r=>r.count),
    count('reports', { status:'open' })
  ]);
  const cells = [
    ['Works', works], ['Published', published], ['Drafts', drafts], ['Private', priv],
    ['Collections', collections], ['Comments', comments], ['Removed comments', removed],
    ['Open reports', openReports]
  ];
  $('panel').innerHTML = `<h2>Right now</h2>
    <div class="stats">${cells.map(([l,v])=>
      `<div class="${l==='Open reports' && v ? 'warn' : ''}"><b>${n(v)}</b><span>${l}</span></div>`).join('')}</div>`;
}

/* ---------------------------------------------------------------- works */
async function loadWorks(){
  const { data, error } = await sb.from('works')
    .select('id,title,kind,slug,status,owner_name,owner_id,created_at')
    .order('created_at', { ascending:false }).limit(500);
  if(error) return fail('works', error);
  table('panel', ['Title','Kind','Status','Owner','Created',''],
    (data||[]).map(w=>[
      `${esc(w.title || 'untitled')}<div class="mono-id">${short(w.id)}</div>`,
      `<span class="pill">${esc(w.kind)}</span>`,
      `<span class="pill ${w.status==='published'?'on':''}">${esc(w.status)}</span>`,
      esc(w.owner_name || short(w.owner_id)),
      when(w.created_at),
      (w.status !== 'private'
        ? `<button class="act" data-act="workprivate" data-id="${w.id}">Make private</button>` : '') +
      `<button class="act danger" data-act="workdelete" data-id="${w.id}">Delete</button>`
    ]), 'No works.');
}

/* ---------------------------------------------------------------- collections */
async function loadCollections(){
  const { data, error } = await sb.from('collections')
    .select('id,title,slug,status,owner_name,owner_id,created_at')
    .order('created_at', { ascending:false }).limit(500);
  if(error) return fail('collections', error);
  table('panel', ['Title','Status','Owner','Created',''],
    (data||[]).map(c=>[
      `${esc(c.title || 'untitled')}<div class="mono-id">${short(c.id)}</div>`,
      `<span class="pill ${c.status==='published'?'on':''}">${esc(c.status)}</span>`,
      esc(c.owner_name || short(c.owner_id)),
      when(c.created_at),
      (c.status !== 'private'
        ? `<button class="act" data-act="colprivate" data-id="${c.id}">Make private</button>` : '') +
      `<button class="act danger" data-act="coldelete" data-id="${c.id}">Delete</button>`
    ]), 'No collections.');
}

/* ---------------------------------------------------------------- comments */
async function loadComments(){
  const { data, error } = await sb.from('comments')
    .select('*').order('created_at', { ascending:false }).limit(500);
  if(error) return fail('comments', error);
  table('panel', ['Who','Comment','On','When',''],
    (data||[]).map(r=>[
      `${esc(r.author_name)}<div class="mono-id">${short(r.user_id)}</div>`,
      r.deleted_at ? '<span class="pill">removed</span>'
                   : `<div class="body">${esc(r.body)}</div>` +
                     (r.parent_id ? '<span class="pill">reply</span>' : ''),
      `${esc(r.target_type)} <span class="mono-id">${short(r.target_id)}</span>`,
      when(r.created_at),
      r.deleted_at
        ? `<button class="act danger" data-act="purge" data-id="${r.id}">Purge</button>`
        : `<button class="act" data-act="hide" data-id="${r.id}">Remove</button>
           <button class="act danger" data-act="purge" data-id="${r.id}">Purge</button>`
    ]), 'No comments yet.');
}

/* ---------------------------------------------------------------- reports */
/* category sorts csam first — a legal reporting obligation (18 U.S.C.
   2258A, NCMEC CyberTipline), not just a severity label, see
   schema-clean.sql's own note on the reports table. Client-side sort
   because "csam always first" isn't a plain column-order the query
   builder can express in one .order() call. */
async function loadReports(){
  const { data, error } = await sb.from('reports')
    .select('*').order('created_at', { ascending:false }).limit(500);
  if(error) return fail('reports', error);
  const rows = (data||[]).slice().sort((a,b) => {
    if(a.status === 'open' && b.status !== 'open') return -1;
    if(b.status === 'open' && a.status !== 'open') return 1;
    if(a.category === 'csam' && b.category !== 'csam') return -1;
    if(b.category === 'csam' && a.category !== 'csam') return 1;
    return 0;
  });
  table('panel', ['Target','Category','Reason','Status','When',''],
    rows.map(r=>({ csam: r.category === 'csam', cells:[
      `${esc(r.target_type)} <span class="mono-id">${short(r.target_id)}</span>`,
      `<span class="pill ${r.category==='csam'?'warn':''}">${esc(r.category)}</span>`,
      `<div class="body">${esc(r.reason)}</div>`,
      `<span class="pill ${r.status==='open'?'on':''}">${esc(r.status)}</span>`,
      when(r.created_at),
      r.status === 'open'
        ? `<button class="act" data-act="close" data-id="${r.id}">Close</button>` : ''
    ]})), 'Nothing reported. Good.', true);
}

/* ---------------------------------------------------------------- users */
async function loadUsers(){
  const { data, error } = await sb.rpc('admin_users', { p_limit: 500 });
  if(error) return fail('admin_users', error);
  table('panel', ['Name','Email','Handle','Joined','Last seen','Works',''],
    (data||[]).map(u=>[
      `${esc(u.display_name || '—')}${u.is_admin ? ' <span class="pill on">admin</span>' : ''}
       <div class="mono-id">${short(u.id)}</div>`,
      esc(u.email || '—'), u.handle ? '@' + esc(u.handle) : '—',
      when(u.created_at), when(u.last_sign_in_at),
      { n: n(u.works_count) }, ''
    ]), 'No users.');
}

/* one table renderer. cells are html strings, or {n:…} for a numeric
   column. rows may be plain arrays, or {csam,cells} when a row needs a
   class (reports). */
function table(into, cols, rows, empty, mayBeReportRow){
  if(!rows.length){ $(into).innerHTML = `<p class="note">${esc(empty)}</p>`; return; }
  const rowHtml = r => {
    const csam = mayBeReportRow && r.csam;
    const cells = mayBeReportRow ? r.cells : r;
    return `<tr class="${csam?'csam':''}">${cells.map(c=>
      (c && typeof c === 'object' && 'n' in c) ? `<td class="n">${c.n}</td>` : `<td>${c}</td>`).join('')}</tr>`;
  };
  $(into).innerHTML = `<p class="note">${rows.length} rows</p><div class="wrap"><table>
    <thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(rowHtml).join('')}</tbody></table></div>`;
  $(into).querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click', ()=>act(b)));
}

async function act(btn){
  const id = btn.dataset.id, a = btn.dataset.act;
  const run = async (label, p) => {
    btn.disabled = true;
    const { error } = await p;
    btn.disabled = false;
    if(error){ alert(label + ' failed: ' + error.message + ' [' + (error.code||'') + ']'); return false; }
    return true;
  };
  if(a === 'workprivate'){
    if(!await run('Make private', sb.from('works').update({ status:'private' }).eq('id', id))) return;
  }else if(a === 'workdelete'){
    if(!confirm('Delete this work and everything under it? This cannot be undone.')) return;
    if(!await run('Delete', sb.from('works').delete().eq('id', id))) return;
  }else if(a === 'colprivate'){
    if(!await run('Make private', sb.from('collections').update({ status:'private' }).eq('id', id))) return;
  }else if(a === 'coldelete'){
    if(!confirm('Delete this collection? This cannot be undone.')) return;
    if(!await run('Delete', sb.from('collections').delete().eq('id', id))) return;
  }else if(a === 'hide'){
    // tombstone, so replies underneath survive
    if(!await run('Remove', sb.from('comments')
      .update({ deleted_at:new Date().toISOString() }).eq('id', id))) return;
  }else if(a === 'purge'){
    if(!confirm('Purge the row outright? Any replies to it go too.')) return;
    if(!await run('Purge', sb.from('comments').delete().eq('id', id))) return;
  }else if(a === 'close'){
    if(!await run('Close', sb.from('reports').update({ status:'closed', resolved_by: me.id, resolved_at: new Date().toISOString() }).eq('id', id))) return;
  }
  load();
}

document.addEventListener('eski-auth', () => { if(!me) boot(); });
boot();
</script>
</body>
</html>
