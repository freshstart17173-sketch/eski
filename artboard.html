/* ============================================================
   eski — the artboard. three live-rebuilt mockups of the pivot
   direction (homepage, maximised post, profile — real HTML, not
   iframes of the empty live app or flat screenshots) plus comment
   pins and pasted reference images on a pannable/zoomable canvas.
   Toolbar chrome researched against the real are.na.xyz (2026-08-15):
   dark ground, #1a1a1a panels, #333 hairlines, three text tiers of
   gray, one pale-lavender primary action, 3px radius on chrome / 0px
   on media, bold normal-case labels. The mockups themselves are all
   Jost (2026-08-15 decision) — Gnomon is reserved for the wordmark
   alone, nowhere else.
   ============================================================ */

:root{
  --bg:#242424; --panel:#1a1a1a; --panel-soft:rgba(26,26,26,.6);
  --border:#333333; --hover-bg:#333333; --text:#e5e5e5; --text-dim:#b2b2b2; --text-mute:#696969;
  --primary:#e2dfe9; --primary-ink:#000000; --radius:3px; --scrim:rgba(0,0,0,.95);
  --font-chrome:'areal','Areal Fallback',Arial,Helvetica,sans-serif;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:var(--font-chrome);font-size:14px;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3a3a3a;border:2px solid var(--panel);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#555}

/* ---------- toolbar ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;
  gap:14px;height:48px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.top .mark{font-family:'Gnomon','Jost',sans-serif;font-weight:700;font-size:18px;color:var(--text);
  text-decoration:none;flex-shrink:0}
.grp{display:flex;align-items:center;gap:4px;flex-shrink:0}
.top button,.top select{font:inherit;font-family:var(--font-chrome);font-size:12.5px;font-weight:700;
  color:var(--text-dim);background:var(--panel);border:1px solid transparent;border-radius:var(--radius);
  height:28px;padding:0 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
.top button:hover{color:var(--text);border-color:var(--border);background:var(--hover-bg)}
.top button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.top button[aria-pressed="true"]:hover{background:var(--primary);border-color:var(--primary)}
.top select{appearance:none;padding-right:22px;background-image:
  linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),linear-gradient(135deg,var(--text-dim) 50%,transparent 50%);
  background-position:calc(100% - 12px) 12px,calc(100% - 8px) 12px;background-size:4px 4px;background-repeat:no-repeat}
.top select:hover{color:var(--text);border-color:var(--border);background-color:var(--hover-bg)}
.zoomreadout{font-variant-numeric:tabular-nums;font-size:12px;color:var(--text-mute);min-width:38px;text-align:center}
.sp{flex:1}
.help{font-size:11px;color:var(--text-mute);white-space:nowrap}
.count{font-size:11px;color:var(--text-mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.auth{margin-left:4px}
.auth-btn{font-size:11px!important;letter-spacing:.02em!important;border-color:var(--border)!important;
  color:var(--text-dim)!important;border-radius:var(--radius)!important}
.auth-menu{background:var(--panel)!important;border-color:var(--border)!important;color:var(--text)!important}

/* ---------- canvas ---------- */
#viewport{position:fixed;top:48px;left:0;right:0;bottom:0;overflow:hidden;cursor:default;background:var(--bg)}
#viewport.grabbing{cursor:grabbing}
#viewport.comment-mode{cursor:crosshair}
#grid{position:absolute;inset:0;pointer-events:none;opacity:0;
  background-image:linear-gradient(#454545 1px,transparent 1px),linear-gradient(90deg,#454545 1px,transparent 1px);
  transition:opacity 120ms linear}
/* no will-change here on purpose: it promotes #world to its own GPU
   layer, and chrome then scales that layer's cached raster texture
   instead of re-rasterizing on zoom, which is what was reading as
   "low res when zoomed in". letting it repaint on each transform costs
   a bit more cpu, not blur. */
#world{position:absolute;top:0;left:0;transform-origin:0 0}

.marquee{position:fixed;border:1px solid var(--primary);background:rgba(226,223,233,.08);pointer-events:none;z-index:40}

/* ---------- selectable mockup chrome ---------- */
.selectable{outline:1px solid transparent;outline-offset:2px;cursor:pointer;transition:outline-color 100ms ease}
.selectable:hover{outline:1px dashed rgba(226,223,233,.55)}
.selectable.selected{outline:2px solid var(--primary)}
.selectable.selected:hover{outline:2px solid var(--primary)}
.section-label{position:absolute;top:-22px;left:0;font-size:11px;color:var(--text-mute);
  font-family:var(--font-chrome);font-weight:700;letter-spacing:.02em}

/* ---------- pasted images ---------- */
.pasted-image{position:absolute;cursor:move}
.pasted-image img{display:block;width:100%;height:100%;object-fit:contain;
  border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.5);background:#111}
.pasted-image.selected img{outline:2px solid var(--primary);outline-offset:2px}
.pasted-image .del{position:absolute;top:-11px;right:-11px;width:22px;height:22px;border-radius:50%;
  background:#a33028;color:#fff;border:2px solid var(--bg);display:none;align-items:center;
  justify-content:center;font-size:13px;line-height:1;cursor:pointer}
.pasted-image.selected .del{display:flex}

/* ---------- comment pins ---------- */
.pin{position:absolute}
.pin .dot{width:26px;height:26px;border-radius:50% 50% 50% 4px;background:var(--primary);
  color:#000;display:flex;align-items:center;justify-content:center;font-family:'Jost',sans-serif;font-weight:600;
  font-size:13px;flex-shrink:0;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.5);transform:rotate(45deg)}
.pin .dot span{transform:rotate(-45deg)}
.pin.resolved .dot{background:var(--text-mute);opacity:.6}
.pin .card{position:absolute;left:32px;top:0;min-width:220px;max-width:320px;background:#fff;color:#111;
  border-radius:0;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:none;flex-direction:column;
  gap:6px;user-select:text;cursor:default}
.pin.open .card,.pin:hover .card{display:flex}
.pin .card .who{display:flex;align-items:center;gap:8px;font-size:11px;color:#888}
.pin .card .who b{color:#111;font-weight:600}
.pin .card .body{font-size:12.5px;color:#333;line-height:1.5;white-space:pre-wrap}
.pin .card .row{display:flex;gap:6px;align-items:center;margin-top:2px}
.pin .card button{font:inherit;font-size:10px;letter-spacing:.02em;border:1px solid #ddd;background:none;
  color:#888;border-radius:var(--radius);padding:3px 9px;cursor:pointer}
.pin .card button:hover{border-color:#999;color:#111}
.pin .card textarea{font:inherit;font-size:12.5px;width:100%;box-sizing:border-box;border:1px solid #ddd;
  padding:6px 8px;resize:vertical;min-height:56px;background:#fafafa;border-radius:var(--radius)}
.pin.editing .card{display:flex}

/* ============================================================
   the eski mockup itself — scoped tokens, independent of the Are.na
   chrome above. jost is the one and only body font now (2026-08-15);
   --font-display (gnomon) is reserved for the wordmark alone — every
   other use of it (headline, pull-quotes, the pin glyph) was pulled
   back to --font-body.
   ============================================================ */
.eski-mockup{
  --paper:#FCFCFC; --paper-dim:#F1F1F1; --ink:#111111; --ink-soft:#3A3A3A; --muted:#6B6B6B;
  --line:var(--ink); --accent:#5B7A6B; --accent-tint:#E9F1ED;
  --font-display:'Gnomon','Jost',sans-serif; --font-body:'Jost',sans-serif;
  --fs-micro:11px; --fs-xs:12px; --fs-sm:13.5px; --fs:15px; --fs-lg:17px; --fs-title:22px; --fs-display:44px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:96px;
  --radius-0:0px; --radius-min:2px;
  position:absolute; background:var(--paper); color:var(--ink); font-family:var(--font-body);
  box-shadow:0 30px 90px rgba(0,0,0,.6);
}
.eski-mockup .ms{position:relative} /* generic wrapper so .section-label can anchor */

/* ---- buttons & chips: NO OUTLINES. state is carried by background fill
   alone (2026-08-15), matching are.na's own dark-fill buttons. ---- */
.chip{font-family:var(--font-body);font-weight:500;font-size:var(--fs-xs);color:var(--ink);
  background:var(--paper-dim);padding:6px 12px;border:none;border-radius:var(--radius-min);
  cursor:pointer;transition:background 120ms ease,color 120ms ease}
.chip:hover{background:#E4E4E4}
.chip.small{font-size:var(--fs-micro);padding:4px 9px}
.chip.active{background:var(--ink);color:var(--paper)}
.chip.active:hover{background:var(--ink-soft)}

.btnline{font-family:var(--font-body);font-weight:600;font-size:var(--fs-sm);color:var(--ink);
  background:var(--paper-dim);text-transform:uppercase;letter-spacing:.06em;padding:10px 18px;
  border:none;border-radius:var(--radius-min);cursor:pointer;
  transition:background 120ms ease,color 120ms ease}
.btnline:hover{background:#E4E4E4}
.btnline.filled{background:var(--ink);color:var(--paper)}
.btnline.filled:hover{background:var(--accent);color:var(--paper)}

.navlink{font-family:var(--font-body);font-weight:500;font-size:13.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;cursor:pointer;padding-bottom:4px;
  border-bottom:2px solid transparent;transition:color 120ms ease,border-color 120ms ease}
.navlink:hover{color:var(--ink)}
.navlink.active{font-weight:600;color:var(--ink);border-bottom-color:var(--ink)}

/* ---- the wordmark. Jost, not Gnomon (2026-08-15) — Gnomon's declared
   baseline sits 0.26em below where its ink actually ends, so every
   wordmark needed a translateY(.12em) fudge to sit level with plain text
   next to it, and that fudge was never quite right at every size and
   line-height it got used at (see tests/wordmark.js in the pre-pivot
   history — the same bug, twice, in the old product). Jost has no such
   quirk: normal baseline alignment just works, no correction term to get
   wrong. "!" set roman, not italic. ---- */
.wordmark{font-family:var(--font-body);font-weight:700;font-size:28px;letter-spacing:-.01em;
  color:var(--ink);line-height:1;display:inline-block}
.wordmark i{font-style:normal;color:inherit}

/* ---- feed switcher: the active feed is the big editable headline; the
   others trail after it in grey, click to switch (then rename in place),
   × on hover to delete. Discover carries data-nodelete and never gets an
   ×. a + at the end makes another feed. no pills, no outlines. ---- */
.feedswitch{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.feedswitch .feed,.feedswitch .feedplus{align-self:baseline}
.feed{font-family:var(--font-body);font-weight:700;font-size:38px;letter-spacing:-.01em;line-height:1.05;
  color:var(--muted);cursor:pointer;transition:color 120ms ease;display:inline-flex;align-items:baseline;gap:8px}
.feed:hover{color:var(--ink-soft)}
.feed.active{color:var(--ink)}
.feed[contenteditable="true"]{outline:none;cursor:text;-webkit-user-select:text;user-select:text}
.feed .fx{opacity:0;font-size:18px;font-weight:400;color:var(--ink);cursor:pointer;transition:opacity 120ms ease}
.feed:hover .fx{opacity:.85}
.feed .fx:hover{opacity:1}
.feedplus{font-family:var(--font-body);font-weight:400;font-size:30px;color:var(--muted);cursor:pointer;
  line-height:1;align-self:center;transition:color 120ms ease;user-select:none}
.feedplus:hover{color:var(--ink)}

.tagadd{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  font-size:16px;line-height:1;color:var(--ink);background:var(--paper-dim);border:none;
  border-radius:var(--radius-min);cursor:pointer;transition:background 120ms ease;font-family:var(--font-body)}
.tagadd:hover{background:#E4E4E4}

/* ---- a collapsible tag panel: click the label to hide/show its chips.
   modifier tags can be folded away entirely this way. ---- */
.tagpanel .taghdr{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.1em;cursor:pointer;user-select:none;transition:color 120ms ease}
.tagpanel .taghdr:hover{color:var(--ink)}
.tagpanel .taghdr .chev{font-size:8px;transition:transform 120ms ease}
.tagpanel.collapsed .taghdr .chev{transform:rotate(-90deg)}
.tagpanel.collapsed .tagbody{display:none}

/* ---- editable tag chip: the × is always shown (so the chip never looks
   lopsided) and dark enough to read. ---- */
.tagchip{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-body);font-weight:500;
  font-size:var(--fs-xs);color:var(--ink);background:var(--paper-dim);padding:6px 11px;
  border-radius:var(--radius-min);cursor:default;transition:background 120ms ease}
.tagchip:hover{background:#E4E4E4}
.tagchip .x{font-size:14px;line-height:1;width:12px;text-align:center;color:var(--ink);opacity:.75;
  cursor:pointer;transition:opacity 120ms ease}
.tagchip .x:hover{opacity:1}
.tagchip .tagtext{outline:none}
.tagchip .tagtext[contenteditable="true"]{-webkit-user-select:text;user-select:text}

/* ---- tag autocomplete popover ---- */
.tagsearch{position:absolute;top:calc(100% + 4px);left:0;z-index:20;width:220px;background:var(--paper);
  box-shadow:0 8px 30px rgba(0,0,0,.2);display:none;flex-direction:column}
.tagsearch.open{display:flex}
.tagsearch input{font:inherit;font-size:var(--fs-xs);padding:8px 10px;border:none;background:var(--paper-dim);
  color:var(--ink);outline:none;font-family:var(--font-body)}
.tagsearch .opt{padding:7px 10px;font-size:var(--fs-xs);color:var(--ink-soft);cursor:pointer;
  transition:background 120ms ease}
.tagsearch .opt:hover{background:var(--paper-dim);color:var(--ink)}

.dtab{font-weight:500;font-size:13px;color:var(--muted);padding:10px 0;cursor:pointer;
  border-bottom:2px solid transparent;transition:color 120ms ease,border-color 120ms ease}
.dtab:hover{color:var(--ink)}
.dtab.active{font-weight:600;color:var(--ink);border-bottom-color:var(--ink)}

.navarrow{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:15px;
  line-height:1;color:var(--ink);background:var(--paper-dim);border:none;border-radius:var(--radius-min);
  cursor:pointer;transition:background 120ms ease,color 120ms ease}
.navarrow:hover{background:var(--ink);color:var(--paper)}

/* ---- upload: drop zone, file filmstrip, form fields ---- */
.dropzone{border:1.5px dashed #C9C9C9;background:var(--paper-dim);border-radius:var(--radius-min);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:36px;
  text-align:center;cursor:pointer;transition:background 120ms ease,border-color 120ms ease}
.dropzone:hover{background:#EAEAEA;border-color:var(--muted)}
.dropzone .dzbig{font-family:var(--font-body);font-weight:600;font-size:15px;color:var(--ink)}
.dropzone .dzsub{font-family:var(--font-body);font-size:12px;color:var(--muted)}
.dropzone svg{width:26px;height:26px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.filmstrip{display:flex;gap:8px;align-items:center;overflow-x:auto;padding-bottom:4px}
.fthumb{width:88px;height:88px;background:var(--paper-dim);flex-shrink:0;position:relative;cursor:pointer;
  display:flex;align-items:center;justify-content:center;overflow:hidden;transition:box-shadow 120ms ease}
.fthumb.sel{box-shadow:inset 0 0 0 3px var(--ink)}
.fthumb .ext{font-family:var(--font-body);font-weight:700;font-size:11px;color:var(--muted);letter-spacing:.04em}
.faddtile{width:88px;height:88px;flex-shrink:0;background:var(--paper-dim);display:flex;align-items:center;
  justify-content:center;font-size:24px;color:var(--muted);cursor:pointer;transition:background 120ms ease}
.faddtile:hover{background:#E4E4E4}

.ufield{display:flex;flex-direction:column;gap:6px}
.ulabel{font-family:var(--font-body);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.uinput,.utext{font-family:var(--font-body);font-size:13.5px;color:var(--ink);background:var(--paper-dim);
  border:none;border-radius:var(--radius-min);padding:10px 12px;width:100%;box-sizing:border-box;outline:none}
.utext{min-height:76px;resize:vertical;line-height:1.5}
.umode{display:flex;gap:8px;flex-wrap:wrap}

/* ---- masonry-of-squares grid: every card sits in a fixed square box,
   media letterboxed inside it, small non-bold caption below (are.na
   grid). no content-type labels — the media speaks for itself. ---- */
/* 4 up, one gap value so horizontal and vertical whitespace match. bigger
   gutter than the first pass (cards read smaller as a result — that was
   the point, not a separate resize). captions may run to two lines, then
   clamp. */
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;width:100%}
.gcard{display:flex;flex-direction:column;gap:8px;cursor:pointer}
/* the square is a layout box only — genuinely no fill of its own. a real
   photo/video covers its own shape completely; nothing should read as a
   "frame" around it. cards with no media of their own (a quote, "other")
   opt into .framed for a background, since they've got nothing to show. */
.gbox{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.gbox.framed{background:var(--paper-dim)}
.gbox .fill{position:absolute;inset:0}
/* the actual media: an inline SVG placeholder carrying its OWN aspect
   ratio (16:9, 4:5, whatever), object-fit:contain inside the square box.
   on whichever axis it comes up short, that gutter is just page — no
   second colour, no visible box. */
.fillmedia{width:100%;height:100%;object-fit:contain;display:block}
.gcap{font-family:var(--font-body);font-weight:400;font-size:var(--fs-xs);color:var(--ink);line-height:1.35;
  text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* the "other" card: a file type eski doesn't render — just its name,
   centred, in the square. */
.gother{font-family:var(--font-body);font-weight:600;font-size:12.5px;color:var(--ink-soft);
  text-align:center;padding:0 16px;word-break:break-word}
.gind{position:absolute;bottom:8px;right:8px;font-family:var(--font-body);font-weight:600;
  font-size:var(--fs-micro);color:var(--paper);background:rgba(17,17,17,.72);padding:3px 6px}
/* text in a card starts at the top, left-aligned (unless the .md sets its
   own alignment). */
.gquote{position:absolute;inset:0;padding:20px;font-family:var(--font-body);font-weight:500;font-size:15px;
  color:var(--ink-soft);line-height:1.45;text-align:left;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
/* a long text/essay post: title + body filling the square, top-aligned,
   faded out at the bottom where it overflows — a readable preview. */
.gtext{position:absolute;inset:0;padding:20px;display:flex;flex-direction:column;gap:10px;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 68%,transparent);mask-image:linear-gradient(#000 68%,transparent)}
.gtext .gtitle{font-family:var(--font-body);font-weight:700;font-size:17px;color:var(--ink);line-height:1.25}
.gtext .gbody{font-family:var(--font-body);font-weight:400;font-size:12.5px;color:var(--ink-soft);line-height:1.6}
.gcount{position:absolute;bottom:8px;left:8px;display:inline-flex;align-items:center;gap:5px;
  font-family:var(--font-body);font-weight:700;font-size:var(--fs-xs);color:var(--paper);
  background:rgba(17,17,17,.8);padding:4px 8px}
.gcount svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2}

/* ---- burger menu on the poster's own post ---- */
.burger{position:absolute;top:52px;right:0;z-index:10;min-width:170px;background:var(--paper);
  box-shadow:0 8px 30px rgba(0,0,0,.22);display:none;flex-direction:column;padding:6px 0}
.burger.open{display:flex}
.burger .mi{font-family:var(--font-body);font-size:13px;color:var(--ink);padding:9px 16px;cursor:pointer;
  display:flex;align-items:center;gap:10px;transition:background 120ms ease}
.burger .mi:hover{background:var(--paper-dim)}
.burger .mi.danger{color:#A33028}
.burger .sep{height:1px;background:var(--paper-dim);margin:4px 0}

/* ---- like / save action buttons on a detail overlay ---- */
.actbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;font-family:var(--font-body);
  font-weight:600;font-size:var(--fs-sm);color:var(--ink);background:var(--paper-dim);border:none;
  border-radius:var(--radius-min);padding:11px 14px;cursor:pointer;transition:background 120ms ease,color 120ms ease}
.actbtn:hover{background:#E4E4E4}
.actbtn .n{color:var(--muted);font-weight:400}
.actbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.actbtn.on{background:var(--ink);color:var(--paper)}
.actbtn.on .n{color:var(--paper)}
.actbtn.on svg{fill:currentColor}
/* like turns ruby red on a pale pink fill when active — its own moment,
   not the generic ink invert every other toggle uses. */
.actbtn.like.on{background:#FCE4EC;color:#C2185B}
.actbtn.like.on .n{color:#C2185B}
.actbtn.like.on svg{fill:#C2185B;stroke:#C2185B}

/* ---- save: a dropdown right under the button, not its own screen ---- */
.savewrap{position:relative;flex:1}
.savedrop{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;background:var(--paper);
  box-shadow:0 8px 30px rgba(0,0,0,.22);display:none;flex-direction:column;padding:8px;min-width:240px}
.savedrop.open{display:flex}
.savedrop .sdhead{font-family:var(--font-body);font-size:11px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.1em;padding:6px 8px}

/* ---- comments: nesting + who's being replied to + collapse ---- */
.cmt{display:flex;gap:10px}
.cmt.nested{margin-left:38px;padding-left:14px;box-shadow:inset 2px 0 0 var(--paper-dim)}
.cmt .avatar{width:28px;height:28px;background:var(--paper);flex-shrink:0}
.cmt .replyto{font-family:var(--font-body);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-bottom:2px}
.cmt .replyto b{color:var(--ink-soft);font-weight:600}
.morecomments{font-family:var(--font-body);font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer;
  padding:2px 0;transition:opacity 120ms ease}
.morecomments:hover{opacity:.7}
.cmt-extra{display:none;flex-direction:column;gap:16px}
.cmt-extra.open{display:flex}

/* ---- collection carousel (one item at a time, ig style) ---- */
.carrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:18px;
  color:#111;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.25);z-index:3;transition:background 120ms ease}
.carrow:hover{background:#fff}
.cdots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
.cdots i{width:6px;height:6px;border-radius:50%;background:rgba(17,17,17,.28)}
.cdots i.on{background:var(--ink)}
.ccount{position:absolute;top:14px;left:14px;font-family:var(--font-body);font-weight:600;font-size:11px;
  color:#fff;background:rgba(17,17,17,.6);padding:3px 8px;z-index:3}

/* ---- segmented control: connected options, one selectable (opposites) ---- */
.seg{display:inline-flex;border-radius:var(--radius-min);overflow:hidden;background:var(--paper-dim)}
.seg .opt{font-family:var(--font-body);font-size:var(--fs-xs);color:var(--ink);padding:6px 12px;cursor:pointer;
  transition:background 120ms ease,color 120ms ease;white-space:nowrap}
.seg .opt:not(:last-child){box-shadow:1px 0 0 rgba(17,17,17,.12)}
.seg .opt.on{background:var(--ink);color:var(--paper)}
.seg .opt:not(.on):hover{background:#E4E4E4}
/* a stand-alone toggle chip (not part of a pair) */
.mchip{font-family:var(--font-body);font-size:var(--fs-xs);color:var(--ink);background:var(--paper-dim);
  padding:6px 12px;border-radius:var(--radius-min);cursor:pointer;transition:background 120ms ease,color 120ms ease}
.mchip:hover{background:#E4E4E4}
.mchip.on{background:var(--ink);color:var(--paper)}
.modgroup{display:flex;flex-direction:column;gap:8px}
.modgrouplabel{font-family:var(--font-body);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}

/* ---- version dropdown ---- */
.verwrap{position:relative}
.verdrop{position:absolute;top:calc(100% + 4px);right:0;z-index:20;min-width:180px;background:var(--paper);
  box-shadow:0 8px 30px rgba(0,0,0,.22);display:none;flex-direction:column;padding:6px 0}
.verdrop.open{display:flex}
.verdrop .vi{font-family:var(--font-body);font-size:12.5px;color:var(--ink);padding:8px 14px;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:12px;transition:background 120ms ease}
.verdrop .vi:hover{background:var(--paper-dim)}
.verdrop .vi.on{font-weight:600}
.verdrop .vi.add{color:var(--accent);font-weight:600}
.verdrop .sep{height:1px;background:var(--paper-dim);margin:4px 0}

/* ---- search: minimised to an icon, sits on the feed-tabs row, grows
   into an input on click instead of owning its own row. ---- */
.searchmini{display:flex;align-items:center;gap:8px;background:var(--paper-dim);border-radius:999px;
  height:34px;padding:0 9px;cursor:pointer;width:34px;overflow:hidden;flex-shrink:0;margin-left:auto;
  transition:width 160ms ease}
.searchmini.open{width:280px;cursor:default}
.searchmini svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;flex-shrink:0}
.searchmini input{border:none;background:none;outline:none;font-family:var(--font-body);font-size:13px;
  color:var(--ink);flex:1;min-width:0;opacity:0;transition:opacity 120ms ease}
.searchmini.open input{opacity:1}
.searchmini input::placeholder{color:var(--muted)}

/* ---- save-to-folder rows ---- */
.folderrow{display:flex;align-items:center;gap:12px;padding:10px 8px;cursor:pointer;border-radius:var(--radius-min);
  transition:background 120ms ease}
.folderrow:hover{background:var(--paper-dim)}
.folderrow .fcheck{width:20px;height:20px;flex-shrink:0;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--ink);
  display:flex;align-items:center;justify-content:center}
.folderrow .fcheck svg{display:none;width:12px;height:12px;fill:none;stroke:var(--paper);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.folderrow.on .fcheck{background:var(--ink)}
.folderrow.on .fcheck svg{display:block}
.folderrow .fname{font-family:var(--font-body);font-size:14px;color:var(--ink);flex:1}
.folderrow .fmeta{font-family:var(--font-body);font-size:12px;color:var(--muted)}

/* ---- add-to-collection dropdown ---- */
.a2c{position:relative}
.a2cdrop{position:absolute;bottom:calc(100% + 6px);left:0;z-index:20;min-width:220px;background:var(--paper);
  box-shadow:0 8px 30px rgba(0,0,0,.22);display:none;flex-direction:column;padding:6px 0}
.a2cdrop.open{display:flex}
.a2cdrop .ci{font-family:var(--font-body);font-size:13px;color:var(--ink);padding:9px 14px;cursor:pointer;transition:background 120ms ease}
.a2cdrop .ci:hover{background:var(--paper-dim)}
.a2cdrop .ci.add{color:var(--accent);font-weight:600}
.a2cdrop .sep{height:1px;background:var(--paper-dim);margin:4px 0}
.gplay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;
  border-radius:50%;background:rgba(17,17,17,.72);display:flex;align-items:center;justify-content:center}
.gplay svg{width:14px;height:14px;fill:var(--paper);margin-left:2px}
</style>

<body>

<header class="top">
  <a class="mark" href="index.html">eski<i>!</i></a>
  <div class="grp">
    <button id="t-select" aria-pressed="true">select</button>
    <button id="t-comment" aria-pressed="false">comment</button>
  </div>
  <div class="grp">
    <button id="zoom-out">−</button>
    <span class="zoomreadout" id="zoom-readout">100%</span>
    <button id="zoom-in">+</button>
    <button id="reset-view">reset view</button>
  </div>
  <span class="count" id="item-count"></span>
  <span class="sp"></span>
  <span class="help">ctrl+scroll zoom · scroll pans up/down · shift+scroll pans sideways · ctrl+shift+drag grabs · paste or drop an image · comment, then click</span>
</header>

<div id="viewport">
  <div id="grid"></div>
  <div id="world"></div>
</div>

<script>
function esc(s){ return (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
async function platform(){
  if(!window.eski && document.readyState === 'loading')
    await new Promise(r => document.addEventListener('DOMContentLoaded', r, { once: true }));
  return window.eski || null;
}
const world = document.getElementById('world');
const viewport = document.getElementById('viewport');
const grid = document.getElementById('grid');

/* ============================================================
   the mockup — real HTML, not a screenshot, so it can be re-fonted
   and so pan/zoom/select work the same over it as over anything
   else. studio is cut from the product (2026-08-15), so it's out of
   the nav here too, not just off the artboard.
   ============================================================ */
/* the square grid box is a fixed frame; the media inside keeps its OWN
   aspect ratio and is contained within it — a 16:9 lands letterboxed
   top/bottom, a 4:5 letterboxed left/right, a 1:1 fills it. done with a
   real <img> (an inline svg swatch standing in for the photo) so plain
   css object-fit does the letterboxing, no js math needed. */
function svgSwatch(w, h, hex){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${w} ${h}'><rect width='${w}' height='${h}' fill='${hex}'/></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}
function mediaFill(ratio, hex){
  const [w, h] = (ratio || '1/1').split('/').map(Number);
  return `<img class="fillmedia" src="${svgSwatch(w * 60, h * 60, hex || '#E4E4E4')}" alt="">`;
}
/* one square grid card. `inner` is optional media-box content laid over
   the fill: a play glyph + duration, a collection count, a pull-quote.
   no content-type label — the media itself carries the type. `ratio` is
   the media's real aspect ratio, e.g. '16/9', '4/5', '9/16'. */
function gcard(title, handle, inner, ratio){
  // .framed only when there's nothing to fill the box with — a real photo
  // covers itself; a bare icon/quote card still needs a ground to sit on.
  return `<div class="gcard selectable">
    <div class="gbox${ratio ? '' : ' framed'}">${ratio ? mediaFill(ratio) : ''}${inner||''}</div>
    <div class="gcap">${esc(title)}</div>
  </div>`;
}
/* a file type eski doesn't render or parse: no thumbnail, just the
   filename, centred in the square. still a full card — sits in the feed
   and in collections like anything else. */
function gother(filename){
  return `<div class="gcard selectable">
    <div class="gbox framed"><div class="gother">${esc(filename)}</div></div>
    <div class="gcap">${esc(filename)}</div>
  </div>`;
}
const PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const vid = d => `<div class="gplay">${PLAY}</div><div class="gind">${esc(d)}</div>`;
const aud = `<div class="gplay">${PLAY}</div>`;
const coll = n => `<div class="gcount"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12"/><path d="M4 16V4h12"/></svg>${esc(n)}</div>`;
const gq = t => `<div class="gquote">"${esc(t)}"</div>`;
/* a titled essay post in the grid: the square shows the title + the start
   of the body, faded where it runs past the box; the handle sits below. */
function gtextcard(title, body, handle){
  return `<div class="gcard selectable">
    <div class="gbox framed" style="align-items:stretch;justify-content:flex-start;">
      <div class="gtext"><div class="gtitle">${esc(title)}</div><div class="gbody">${esc(body)}</div></div>
    </div>
    <div class="gcap">${esc(title)}</div>
  </div>`;

/* the mockups are live, so their own controls actually work: detail
   tabs switch panels, feed tabs open/close/add, tags add (with a small
   autocomplete) and remove, modifier chips toggle. all of it runs on
   `world` so it fires BEFORE the viewport's select handler and can
   stopPropagation to keep a control-click from also selecting the box.
   in comment mode nothing here fires — a click is a note, everywhere. */
function makeTagChip(label, editable){
  const s = document.createElement('span');
  s.className = 'tagchip';
  s.innerHTML = `<span class="tagtext"${editable ? ' contenteditable="true" spellcheck="false"' : ''}>${esc(label)}</span><span class="x">&times;</span>`;
  return s;
}
world.addEventListener('click', e => {
  if(mode === 'comment') return;
  // let clicks into any editable field (feed rename, freeform tag, caption)
  // place the caret instead of triggering select/interaction below.
  if(e.target.isContentEditable) return;

  // detail Tags/Comments tabs
  const dtab = e.target.closest('.dtab');
  if(dtab){
    e.stopPropagation();
    const row = dtab.parentElement;
    row.querySelectorAll(':scope > .dtab').forEach(t => t.classList.remove('active'));
    dtab.classList.add('active');
    const name = dtab.dataset.tab;
    if(name){
      const stack = row.parentElement.querySelector('[data-panel="' + name + '"]')?.parentElement;
      if(stack){
        stack.querySelectorAll('[data-panel]').forEach(p => p.style.display = 'none');
        stack.querySelector('[data-panel="' + name + '"]').style.display = 'flex';
      }
    }
    return;
  }

  // collapsible tag panel: fold/unfold its chips
  const toggle = e.target.closest('[data-toggle]');
  if(toggle){
    e.stopPropagation();
    toggle.closest('.tagpanel').classList.toggle('collapsed');
    return;
  }

  // feed: delete (only feeds that carry an ×; Discover has data-nodelete)
  if(e.target.closest('[data-feeddel]')){
    e.stopPropagation();
    e.target.closest('.feed').remove();
    return;
  }
  // feed: add another
  if(e.target.closest('[data-feedadd]')){
    e.stopPropagation();
    const add = e.target.closest('[data-feedadd]');
    const f = document.createElement('span');
    f.className = 'feed';
    f.innerHTML = 'new feed<span class="fx" data-feeddel>&times;</span>';
    add.parentElement.insertBefore(f, add);
    return;
  }
  // feed: switch active (and make it editable in place); clicking the
  // already-active feed does nothing so its caret/rename works.
  const feed = e.target.closest('.feed');
  if(feed){
    e.stopPropagation();
    if(!feed.classList.contains('active')){
      feed.parentElement.querySelectorAll('.feed').forEach(f => {
        f.classList.remove('active'); f.setAttribute('contenteditable', 'false');
      });
      feed.classList.add('active'); feed.setAttribute('contenteditable', 'true');
    }
    return;
  }

  // upload: mode segmented control (separate / collection / versions) —
  // also toggles the collection-only-vs-posts extra block and relabels
  // the per-item caption and the publish button to match.
  const umode = e.target.closest('[data-umode]');
  if(umode){
    e.stopPropagation();
    const group = umode.parentElement;
    group.querySelectorAll('[data-umode]').forEach(m => m.classList.remove('active'));
    umode.classList.add('active');
    const mode = umode.dataset.umode;
    const card = umode.closest('.eski-mockup');
    const extra = card.querySelector('[data-collection-extra]');
    if(extra) extra.style.display = mode === 'collection' ? 'flex' : 'none';
    const capLabel = card.querySelector('[data-captionlabel]');
    if(capLabel) capLabel.textContent = mode === 'collection' ? 'Caption for this item (optional)'
      : mode === 'versions' ? 'Caption · version 2 of 4' : 'Caption · post 2 of 4';
    const pubLabel = card.querySelector('[data-publishlabel]');
    if(pubLabel) pubLabel.textContent = mode === 'collection' ? 'Publish collection'
      : mode === 'versions' ? 'Publish 1 post · 4 versions' : 'Publish 4 posts';
    return;
  }
  // upload: filmstrip select
  const fthumb = e.target.closest('[data-fthumb]');
  if(fthumb){
    e.stopPropagation();
    fthumb.parentElement.querySelectorAll('[data-fthumb]').forEach(t => t.classList.remove('sel'));
    fthumb.classList.add('sel');
    return;
  }

  // poster's burger menu: open/close
  if(e.target.closest('[data-burger]')){
    e.stopPropagation();
    const menu = e.target.closest('[data-burger]').parentElement.querySelector('.burger');
    if(menu) menu.classList.toggle('open');
    return;
  }
  // a burger menu item: (mockup) just close the menu
  if(e.target.closest('.burger .mi')){
    e.stopPropagation();
    e.target.closest('.burger').classList.remove('open');
    return;
  }
  // like toggle
  const act = e.target.closest('[data-act-toggle]');
  if(act){ e.stopPropagation(); act.classList.toggle('on'); return; }
  // save button: opens the folder-picker dropdown right under it. picking
  // folders (below) doesn't close it — same "stays open till you click
  // away" behaviour as the version/add-to-collection popovers.
  const savebtn = e.target.closest('[data-savebtn]');
  if(savebtn){
    e.stopPropagation();
    savebtn.parentElement.querySelector('.savedrop').classList.toggle('open');
    return;
  }

  // version dropdown: open/close
  if(e.target.closest('[data-ver]')){
    e.stopPropagation();
    e.target.closest('.verwrap').querySelector('.verdrop').classList.toggle('open');
    return;
  }
  if(e.target.closest('.verdrop .vi')){
    e.stopPropagation();
    e.target.closest('.verdrop').classList.remove('open');
    return;
  }
  // add-to-collection dropdown
  if(e.target.closest('[data-a2c]')){
    e.stopPropagation();
    e.target.closest('.a2c').querySelector('.a2cdrop').classList.toggle('open');
    return;
  }
  if(e.target.closest('.a2cdrop .ci')){
    e.stopPropagation();
    e.target.closest('.a2cdrop').classList.remove('open');
    return;
  }
  // modifier: segmented (single-select within the group)
  const segopt = e.target.closest('[data-seg] [data-o]');
  if(segopt){
    e.stopPropagation();
    segopt.parentElement.querySelectorAll('[data-o]').forEach(o => o.classList.remove('on'));
    segopt.classList.add('on');
    return;
  }
  // modifier: independent toggle chip
  const mtog = e.target.closest('[data-mtoggle]');
  if(mtog){ e.stopPropagation(); mtog.classList.toggle('on'); return; }
  // save-to-folder row toggle
  const frow = e.target.closest('.folderrow');
  if(frow){ e.stopPropagation(); frow.classList.toggle('on'); return; }

  // search: minimised icon opens into an inline input on the feed-tabs row
  const smini = e.target.closest('[data-searchmini]');
  if(smini && !smini.classList.contains('open')){
    e.stopPropagation();
    smini.classList.add('open');
    smini.querySelector('input').focus();
    return;
  }
  // comments: reveal the rest of the thread — the toggle and the hidden
  // block are always adjacent siblings, so this doesn't need to search.
  if(e.target.closest('[data-morecomments]')){
    e.stopPropagation();
    const btn = e.target.closest('[data-morecomments]');
    btn.nextElementSibling.classList.add('open');
    btn.style.display = 'none';
    return;
  }

  // tag chip: remove
  if(e.target.closest('.tagchip') && e.target.classList.contains('x')){
    e.stopPropagation();
    e.target.closest('.tagchip').remove();
    return;
  }
  // tag add: freeform rows get a new editable chip; search rows open the
  // autocomplete popover.
  if(e.target.closest('[data-tagadd]')){
    e.stopPropagation();
    const add = e.target.closest('[data-tagadd]');
    const row = add.closest('[data-tagrow]');
    if(row && row.hasAttribute('data-freeform')){
      const chip = makeTagChip('#', true);
      row.insertBefore(chip, add);
      const t = chip.querySelector('.tagtext');
      t.focus();
      const sel = window.getSelection(), rg = document.createRange();
      rg.selectNodeContents(t); rg.collapse(false); sel.removeAllRanges(); sel.addRange(rg);
      return;
    }
    const search = row.parentElement.querySelector('[data-tagsearch]');
    if(search) search.classList.toggle('open');
    return;
  }
  // autocomplete option: add it as a chip
  const opt = e.target.closest('.tagsearch .opt');
  if(opt){
    e.stopPropagation();
    const search = opt.closest('[data-tagsearch]');
    const row = search.parentElement.querySelector('[data-tagrow]');
    row.insertBefore(makeTagChip(opt.textContent.trim()), row.querySelector('[data-tagadd]'));
    search.classList.remove('open');
    return;
  }

});

/* ---------- pan / zoom ---------- */
let panX = 60, panY = -20, zoom = 0.55;
const ZMIN = 0.05, ZMAX = 3;
function applyTransform(){
  world.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  document.getElementById('zoom-readout').textContent = Math.round(zoom * 100) + '%';
  const base = 24 * zoom;
  grid.style.backgroundSize = `${base}px ${base}px`;
  grid.style.backgroundPosition = `${panX}px ${panY}px`;
  grid.style.opacity = Math.max(0, Math.min(.35, (zoom - 1.4) * .3));
}
function resetView(){ panX = 60; panY = -20; zoom = 0.55; applyTransform(); }
applyTransform();

function screenToWorld(clientX, clientY){
  const r = viewport.getBoundingClientRect();
  return { x: (clientX - r.left - panX) / zoom, y: (clientY - r.top - panY) / zoom };
}
function zoomAt(clientX, clientY, factor){
  const r = viewport.getBoundingClientRect();
  const mx = clientX - r.left, my = clientY - r.top;
  const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
  zoom = Math.min(ZMAX, Math.max(ZMIN, zoom * factor));
  panX = mx - wx * zoom; panY = my - wy * zoom;
  applyTransform();
}

/* ctrl+scroll = zoom · plain scroll = pan vertical · shift+scroll = pan
   horizontal. attached to the viewport itself, not the grid, so it fires
   over the mockup, a pasted image, a pin — anything, since none of it is
   an iframe any more. */
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  if(e.ctrlKey || e.metaKey){ zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0012)); return; }
  if(e.shiftKey){ panX -= (e.deltaX || e.deltaY); applyTransform(); return; }
  panY -= e.deltaY; panX -= e.deltaX; applyTransform();
}, { passive: false });

document.getElementById('zoom-in').onclick  = () => zoomAt(innerWidth/2, innerHeight/2 + 24, 1.25);
document.getElementById('zoom-out').onclick = () => zoomAt(innerWidth/2, innerHeight/2 + 24, 0.8);
document.getElementById('reset-view').onclick = resetView;

/* ctrl+shift+drag = grab and pan, from anywhere, taking priority over
   select/move. plain drag on empty canvas = marquee select. */
let grabbing = false, grabStart = null;
let marqueeStart = null, marqueeEl = null;
viewport.addEventListener('mousedown', e => {
  if(e.ctrlKey && e.shiftKey){
    grabbing = true; grabStart = { x: e.clientX, y: e.clientY, panX, panY };
    viewport.classList.add('grabbing');
    e.preventDefault();
    return;
  }
  if(e.target === viewport || e.target === world || e.target === grid){
    marqueeStart = { x: e.clientX, y: e.clientY };
    marqueeEl = document.createElement('div');
    marqueeEl.className = 'marquee';
    document.body.appendChild(marqueeEl);
  }
});
window.addEventListener('mousemove', e => {
  if(grabbing && grabStart){
    panX = grabStart.panX + (e.clientX - grabStart.x);
    panY = grabStart.panY + (e.clientY - grabStart.y);
    applyTransform();
  }
  if(dragImg){
    const pt = screenToWorld(e.clientX, e.clientY);
    dragImg.item.x = pt.x - dragImg.offX; dragImg.item.y = pt.y - dragImg.offY;
    dragImg.el.style.left = dragImg.item.x + 'px'; dragImg.el.style.top = dragImg.item.y + 'px';
  }
  if(marqueeStart && marqueeEl){
    const x = Math.min(marqueeStart.x, e.clientX), y = Math.min(marqueeStart.y, e.clientY);
    const w = Math.abs(e.clientX - marqueeStart.x), h = Math.abs(e.clientY - marqueeStart.y);
    Object.assign(marqueeEl.style, { left: x+'px', top: y+'px', width: w+'px', height: h+'px' });
  }
});
window.addEventListener('mouseup', e => {
  if(grabbing){ grabbing = false; viewport.classList.remove('grabbing'); }
  if(dragImg){ saveImagePosition(dragImg.item); dragImg = null; }
  if(marqueeStart && marqueeEl){
    const box = marqueeEl.getBoundingClientRect();
    if(box.width > 4 || box.height > 4){
      clearSelection();
      document.querySelectorAll('.selectable, .pasted-image').forEach(el => {
        const r = el.getBoundingClientRect();
        if(r.right > box.left && r.left < box.right && r.bottom > box.top && r.top < box.bottom) selectEl(el);
      });
    }
    marqueeEl.remove(); marqueeEl = null; marqueeStart = null;
  }
});

/* ---------- select / comment tool ---------- */
let mode = 'select';
const btnSelect = document.getElementById('t-select');
const btnComment = document.getElementById('t-comment');
function setMode(m){
  mode = m;
  btnSelect.setAttribute('aria-pressed', m === 'select');
  btnComment.setAttribute('aria-pressed', m === 'comment');
  viewport.classList.toggle('comment-mode', m === 'comment');
}
btnSelect.onclick = () => setMode('select');
btnComment.onclick = () => setMode('comment');
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ setMode('select'); clearSelection(); }
  if((e.key === 'Delete' || e.key === 'Backspace') && document.activeElement.tagName !== 'TEXTAREA'){
    selectedImages.forEach(item => removeItem(item));
  }
});

const selectedEls = new Set();
let selectedImages = new Set();
function clearSelection(){
  selectedEls.forEach(el => el.classList.remove('selected'));
  selectedEls.clear(); selectedImages.clear();
}
function selectEl(el){
  selectedEls.add(el); el.classList.add('selected');
  if(el.__item) selectedImages.add(el.__item);
}

viewport.addEventListener('click', async e => {
  const pin = e.target.closest('.pin');
  if(pin) return;
  // comment mode wins over everything below it: a click anywhere on the
  // design — a card, a chip, the mockup background, doesn't matter —
  // drops a note there. it used to bail out the moment the click landed
  // on a .selectable or a pasted image, which is most of the design, so
  // "click a spot to comment" mostly didn't work. fixed.
  if(mode === 'comment'){
    if(grabbing) return;
    const pt = screenToWorld(e.clientX, e.clientY);
    await startNewComment(pt);
    return;
  }
  const sel = e.target.closest('.selectable');
  const img = e.target.closest('.pasted-image');
  if(img){ return; } // handled on mousedown for drag+select together
  if(sel){ clearSelection(); selectEl(sel); return; }
  clearSelection();
});

/* ---------- data layer (comment pins + pasted images) ---------- */
let sb = null, me = null;
const items = new Map();
let dragImg = null;

function itemEl(row){ return row.kind === 'comment' ? renderPin(row) : renderImage(row); }

function renderImage(row){
  const el = document.createElement('div');
  el.className = 'pasted-image';
  el.style.left = row.x + 'px'; el.style.top = row.y + 'px';
  el.style.width = row.w + 'px'; el.style.height = row.h + 'px';
  const url = sb.storage.from('artboard').getPublicUrl(row.image_key).data.publicUrl;
  el.innerHTML = `<img src="${esc(url)}" alt="" draggable="false"><div class="del">×</div>`;
  const item = { row, el, kind: 'image', x: row.x, y: row.y };
  el.__item = item;
  el.addEventListener('mousedown', e => {
    if(e.target.classList.contains('del')) return;
    if(mode === 'comment') return; // let the click through to place a note here instead
    e.stopPropagation();
    clearSelection(); selectEl(el);
    const pt = screenToWorld(e.clientX, e.clientY);
    dragImg = { item, el, offX: pt.x - row.x, offY: pt.y - row.y };
  });
  el.querySelector('.del').addEventListener('click', e => { e.stopPropagation(); removeItem(item); });
  return item;
}
async function saveImagePosition(item){
  if(!me) return;
  await sb.from('artboard_items').update({ x: item.x, y: item.y }).eq('id', item.row.id);
}

function renderPin(row){
  const el = document.createElement('div');
  el.className = 'pin' + (row.resolved ? ' resolved' : '');
  el.style.left = row.x + 'px'; el.style.top = row.y + 'px';
  const when = new Date(row.created_at);
  el.innerHTML = `
    <div class="dot"><span>!</span></div>
    <div class="card">
      <div class="who"><b>${esc(row.owner_name || 'someone')}</b>${when.toLocaleDateString()}</div>
      <div class="body">${esc(row.body)}</div>
      <div class="row">
        <button class="resolve">${row.resolved ? 'reopen' : 'mark resolved'}</button>
        <button class="delete">delete</button>
      </div>
    </div>`;
  const item = { row, el, kind: 'comment' };
  el.querySelector('.dot').addEventListener('click', e => { e.stopPropagation(); el.classList.toggle('open'); });
  el.addEventListener('mousedown', e => e.stopPropagation());
  el.querySelector('.resolve').addEventListener('click', async e => {
    e.stopPropagation();
    if(!me){ alert('sign in first (top right) to mark notes resolved.'); return; }
    const next = !row.resolved;
    const { error } = await sb.rpc('toggle_artboard_resolved', { item_id: row.id, next });
    if(!error){ row.resolved = next; el.classList.toggle('resolved', next); }
    else alert('could not update: ' + error.message);
  });
  el.querySelector('.delete').addEventListener('click', e => { e.stopPropagation(); removeItem(item); });
  return item;
}

async function removeItem(item){
  if(!me || me.id !== item.row.user_id) return;
  if(item.kind === 'comment' && !confirm('delete this note?')) return;
  const { error } = await sb.from('artboard_items').delete().eq('id', item.row.id);
  if(error) return;
  item.el.remove(); items.delete(item.row.id); updateCount();
  selectedImages.delete(item);
}
function addLive(row){
  if(items.has(row.id)) return;
  const item = itemEl(row);
  world.appendChild(item.el);
  items.set(row.id, item);
  updateCount();
}
function updateLive(row){
  const item = items.get(row.id);
  if(!item) return addLive(row);
  Object.assign(item.row, row);
  if(row.kind === 'comment'){
    item.el.classList.toggle('resolved', row.resolved);
    const body = item.el.querySelector('.body'); if(body) body.textContent = row.body;
  }else{
    item.el.style.left = row.x + 'px'; item.el.style.top = row.y + 'px';
  }
}
function removeLive(id){
  const item = items.get(id);
  if(item){ item.el.remove(); items.delete(id); updateCount(); }
}
function updateCount(){
  document.getElementById('item-count').textContent = items.size ? items.size + ' items on the board' : '';
}

async function startNewComment(pt){
  if(!me){ alert('sign in first (top right) — comments need an account.'); return; }
  const el = document.createElement('div');
  el.className = 'pin editing';
  el.style.left = pt.x + 'px'; el.style.top = pt.y + 'px';
  el.innerHTML = `<div class="dot"><span>!</span></div>
    <div class="card">
      <textarea placeholder="say what you actually mean — this is precise feedback, not a like button." autofocus></textarea>
      <div class="row"><button class="save">save</button><button class="cancel">cancel</button></div>
    </div>`;
  world.appendChild(el);
  const ta = el.querySelector('textarea');
  ta.focus();
  const cleanup = () => el.remove();
  el.querySelector('.cancel').onclick = e => { e.stopPropagation(); cleanup(); };
  el.querySelector('.save').onclick = async e => {
    e.stopPropagation();
    const body = ta.value.trim();
    if(!body) return cleanup();
    const owner_name = (me.user_metadata && (me.user_metadata.full_name || me.user_metadata.name)) || me.email || 'you';
    const { data, error } = await sb.from('artboard_items').insert({
      kind: 'comment', x: pt.x, y: pt.y, body, user_id: me.id, owner_name
    }).select('*').single();
    cleanup();
    if(!error) addLive(data);
  };
}

/* ---------- paste + drop images ---------- */
const MAXW = 560;
async function handleIncomingImage(blob, atPoint){
  if(!me){ alert('sign in first (top right) — pasting an image needs an account.'); return; }
  const dims = await new Promise(res => {
    const img = new Image();
    img.onload = () => res({ w: img.naturalWidth, h: img.naturalHeight });
    img.src = URL.createObjectURL(blob);
  });
  let w = dims.w, h = dims.h;
  if(w > MAXW){ h = h * (MAXW / w); w = MAXW; }
  const pt = atPoint || screenToWorld(innerWidth / 2, innerHeight / 2 + 24);
  const ext = (blob.type.split('/')[1] || 'png').replace('jpeg', 'jpg');
  const path = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}.${ext}`;
  const up = await sb.storage.from('artboard').upload(path, blob, { contentType: blob.type });
  if(up.error){ alert('upload failed: ' + up.error.message); return; }
  const owner_name = (me.user_metadata && (me.user_metadata.full_name || me.user_metadata.name)) || me.email || 'you';
  const { data, error } = await sb.from('artboard_items').insert({
    kind: 'image', x: pt.x - w / 2, y: pt.y - h / 2, w, h, image_key: path, user_id: me.id, owner_name
  }).select('*').single();
  if(!error) addLive(data);
}
window.addEventListener('paste', e => {
  const dt = e.clipboardData; if(!dt) return;
  for(const it of dt.items){
    if(it.type.startsWith('image/')){ handleIncomingImage(it.getAsFile()); break; }
  }
});
viewport.addEventListener('dragover', e => e.preventDefault());
viewport.addEventListener('drop', e => {
  e.preventDefault();
  const pt = screenToWorld(e.clientX, e.clientY);
  const files = [...(e.dataTransfer?.files || [])].filter(f => f.type.startsWith('image/'));
  files.forEach(f => handleIncomingImage(f, pt));
});

/* ---------- boot ---------- */
(async function boot(){
  const eski = await platform();
  sb = eski && await eski.ready;
  if(!sb){ alert('could not reach the server — comments and pasting are disabled, the board still renders.'); return; }
  me = (await sb.auth.getUser()).data.user || null;
  document.addEventListener('eski-auth', e => { me = e.detail.user; });

  const { data, error } = await sb.from('artboard_items').select('*').order('created_at');
  if(!error) for(const row of data) addLive(row);

  sb.channel('artboard-live')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'artboard_items' }, p => addLive(p.new))
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'artboard_items' }, p => updateLive(p.new))
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'artboard_items' }, p => removeLive(p.old.id))
    .subscribe();
})();
</script>
